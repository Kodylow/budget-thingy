      tags: [limits]
      summary: Retry selected failed or verification-pending targets
      parameters:
        - $ref: "#/components/parameters/LimitOperationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitOperationRetryInput" }
      responses:
        "202":
          description: Eligible targets queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitOperation" }
        "400":
          description: No eligible targets selected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Operation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
components:
  responses:
    SpendCsv:
      description: CSV containing exactly the authorized filtered rows in server sort order.
      headers:
        X-Filtered-Rows:
          schema: { type: integer, minimum: 0 }
        X-Total-Spend-Usd:
          schema: { type: number }
        X-Generation-Id:
          schema: { type: string }
        X-Usage-Range:
          description: UTC end-exclusive committed reporting interval.
          schema: { type: string }
      content:
        text/csv:
          schema: { type: string }
    Unauthorized:
      description: Authentication required — no valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: >
        Authenticated but not authorized (neither account admin nor an enabled
        workspace admin, or attempting an account-admin-only action).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  parameters:
    LimitOperationIdPath:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F-]{36}$'
    WorkspaceIdPath:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      description: Project UUID, qualified by the workspaceId path segment.
      schema:
        type: string
        minLength: 1
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    ClusterKeyPath:
      name: clusterKey
      in: path
      required: true
      schema:
        type: string
    TeamNamePath:
      name: teamName
      in: path
      required: true
      description: URL-encoded team name (spaces as %20)
      schema:
        type: string
    RangeType:
      name: rangeType
      in: query
      required: false
      description: Date range for usage. full-term = rolling May 20, 2026 through today (default), billing = current billing cycle, mtd = month to date, ytd = year to date, custom requires startDate and endDate.
      schema:
        type: string
        enum: [billing, full-term, mtd, ytd, custom]
    ViewScope:
      name: viewScope
      in: query
      required: false
      description: Server-resolved presentation scope; managed excludes unrelated self-only grants.
      schema:
        type: string
        enum: [managed, my, all_authorized]
    TrendGranularity:
      name: granularity
      in: query
      required: false
      schema:
        type: string
        enum: [day, week, month]
    TrendMode:
      name: trendMode
      in: query
      required: false
      schema:
        type: string
        enum: [period, cumulative]
    ProjectionHorizon:
      name: projectionHorizon
      in: query
      required: false
      description: Future boundary for the deterministic projection. year_end ends at January 1 of the next calendar year; term_end is the fixed confirmed contract through May 20, 2027 (exclusive end May 21). cycle_end remains available only when verified billing-cycle metadata exists; planning_end requires planningEndDate.
      schema:
        type: string
        enum: [month_end, year_end, term_end, cycle_end, planning_end]
        default: month_end
    PlanningEndDate:
      name: planningEndDate
      in: query
      required: false
      description: Inclusive user-selected UTC projection end (YYYY-MM-DD), required with projectionHorizon=planning_end; must be today or within the next five years.
      schema:
        type: string
    SpendSearch:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SpendStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [all, over, attention, budgeted, unbudgeted, no_allocation, shared, explicit, inherited, no_limit, unavailable]
    SpendWorkspace:
      name: workspaceId
      in: query
      required: false
      description: Exact authorized workspace facet. Omit to include every workspace in the resolved scope.
      schema:
        type: string
        maxLength: 200
    SpendSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [status, spend_desc, spend_asc, name_asc, name_desc]
    ProjectDeployedOnly:
      name: deployedOnly
      in: query
      required: false
      description: >
        When true, include only projects whose authoritative cached
        hasDeployment value is true. Unknown deployment state does not match.
      schema:
        type: boolean
        default: false
    ProjectStaleButSpending:
      name: staleButSpending
      in: query
      required: false
      description: >
        When true, include only projects with a known updatedAt at least 30
        elapsed days before evaluation and positive authorized spend in the
        current UTC calendar month. Missing timestamps do not match.
      schema:
        type: boolean
        default: false
    ProjectSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [status, spend_desc, spend_asc, name_asc, name_desc, updated_at_desc, updated_at_asc]
    SpendPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    SpendPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    StartDate:
      name: startDate
      in: query
      required: false
      description: Inclusive UTC start date (YYYY-MM-DD), required when rangeType=custom
      schema:
        type: string
    EndDate:
      name: endDate
      in: query
      required: false
      description: Inclusive UTC end date (YYYY-MM-DD), required when rangeType=custom
      schema:
        type: string
    ScopeGroupIds:
      name: scopeGroupIds
      in: query
      required: false
      description: Optional comma-separated group IDs that define a team-cluster deduplication scope.
      schema:
        type: string
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    PreviewAsHeader:
      name: X-Preview-As
      in: header
      required: false
      description: Designated-operator-only synthetic authorization view.
      schema:
        type: string
        pattern: '^(workspace_admin|team_admin|member):.+$'
  schemas:
    SetLimitsGroup:
      type: object
      required: [groupId, name, familyName, role, eligibleUserIds]
      properties:
        groupId: { type: string }
        name: { type: string }
        familyName: { type: ["string", "null"] }
        role: { type: ["string", "null"] }
        eligibleUserIds:
          type: array
          items: { type: string, pattern: '^[1-9]\d*$' }
    SetLimitsMember:
      type: object
      required: [userId, username, name, email, role, groupIds, isInternal, isDisabled, eligible, usageUsd, explicitLimitUsd, effectiveLimitUsd, limitState]
      properties:
        userId: { type: string, pattern: '^[1-9]\d*$' }
        username: { type: string }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        role: { type: string }
        groupIds:
          type: array
          items: { type: string }
        isInternal: { type: boolean }
        isDisabled: { type: boolean }
        eligible: { type: boolean }
        usageUsd: { type: ["number", "null"] }
        explicitLimitUsd: { type: ["number", "null"] }
        effectiveLimitUsd: { type: ["number", "null"] }
        limitState:
          type: string
          enum: [explicit, inherited, no_limit, unavailable]
    SetLimitsWorkspace:
      type: object
      required: [workspaceId, workspaceName, canWrite, unavailableReason, billingPeriod, limitObservation, groups, members]
      properties:
        workspaceId: { type: string, pattern: '^[A-Za-z0-9]+$' }
        workspaceName: { type: string }
        canWrite: { type: boolean }
        unavailableReason: { type: ["string", "null"] }
        billingPeriod:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        limitObservation:
          type: object
          required: [status, observedAt, error]
          properties:
            status: { type: string, enum: [available, unavailable, failed] }
            observedAt: { type: ["string", "null"], format: date-time }
            error: { type: ["string", "null"] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/SetLimitsGroup" }
        members:
          type: array
          items: { $ref: "#/components/schemas/SetLimitsMember" }
    LimitOperationPrepareInput:
      type: object
      additionalProperties: false
      required: [workspaceId, amountUsd, userIds, groupIds, idempotencyKey]
      properties:
        workspaceId: { type: string, pattern: '^[A-Za-z0-9]+$' }
        amountUsd: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        userIds:
          type: array
          maxItems: 1000
          items: { type: string, pattern: '^[1-9]\d*$' }
        groupIds:
          type: array
          maxItems: 1000
          items: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    LimitOperationCommitInput:
      type: object
      additionalProperties: false
      required: [reviewFingerprint, amountUsd, userIds]
      properties:
        reviewFingerprint: { type: string, minLength: 64, maxLength: 64 }
        amountUsd: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        userIds:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, pattern: '^[1-9]\d*$' }
    LimitOperationRetryInput:
      type: object
      additionalProperties: false
      required: [userIds, idempotencyKey]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, pattern: '^[1-9]\d*$' }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    LimitTargetAttempt:
      type: object
      required: [at, stage, outcome]
      properties:
        at: { type: string, format: date-time }
        stage: { type: string, enum: [authorization, membership, reconcile, write, verification, audit] }
        outcome: { type: string }
        requestId: { type: ["string", "null"] }
        retryAfterMs: { type: ["integer", "null"] }
        message: { type: ["string", "null"] }
    LimitOperationTarget:
      type: object
      required: [workspaceId, userId, memberName, memberEmail, oldAmountUsd, newAmountUsd, state, attempts, history, errorStage, errorCode, errorMessage, upstreamRequestId, queuedAt, applyingAt, verifiedAt, failedAt]
      properties:
        workspaceId: { type: string }
        userId: { type: string }
        memberName: { type: ["string", "null"] }
        memberEmail: { type: ["string", "null"] }
        oldAmountUsd: { type: ["number", "null"] }
        newAmountUsd: { type: number }
        state: { type: string, enum: [queued, applying, verified, failed, verification_pending] }
        attempts: { type: integer }
        history:
          type: array
          items: { $ref: "#/components/schemas/LimitTargetAttempt" }
        errorStage: { type: ["string", "null"] }
        errorCode: { type: ["string", "null"] }
        errorMessage: { type: ["string", "null"] }
        upstreamRequestId: { type: ["string", "null"] }
        queuedAt: { type: ["string", "null"], format: date-time }
        applyingAt: { type: ["string", "null"], format: date-time }
        verifiedAt: { type: ["string", "null"], format: date-time }
        failedAt: { type: ["string", "null"], format: date-time }
    LimitOperation:
      type: object
      required: [id, workspaceId, state, amountUsd, reviewFingerprint, actorUserId, preparedAt, committedAt, completedAt, counts, targets]
      properties:
        id: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
        workspaceId: { type: string }
        state: { type: string, enum: [prepared, queued, running, completed] }
        amountUsd: { type: number }
        reviewFingerprint: { type: string }
        actorUserId: { type: string }
        preparedAt: { type: string, format: date-time }
        committedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        counts:
          type: object
          required: [total, queued, applying, verified, failed, verificationPending]
          properties:
            total: { type: integer }
            queued: { type: integer }
            applying: { type: integer }
            verified: { type: integer }
            failed: { type: integer }
            verificationPending: { type: integer }
        targets:
          type: array
          items: { $ref: "#/components/schemas/LimitOperationTarget" }
    ReportingPeriod:
      type: object
      required: [start, endExclusive, timezone, label]
      properties:
        start: { type: string, format: date-time }
        endExclusive: { type: string, format: date-time }
        timezone: { type: string, const: UTC }
        label: { type: string }
    AccountingMetadata:
      type: object
      required: [generationId, costBasis, status, dataAsOf, directoryDataAsOf, stale, coverage, qualifications, limitObservation]
      properties:
        generationId: { type: string }
        costBasis:
          type: string
          enum: [allocation_eligible_committed]
        status:
          type: string
          enum: [complete, stale, partial, empty]
        dataAsOf: { type: [string, "null"], format: date-time }
        directoryDataAsOf: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        coverage:
          type: object
          required: [ratio, requestedDays, missingDays, failedWorkspaceDays]
          properties:
            ratio: { type: number, minimum: 0, maximum: 1 }
            requestedDays: { type: integer, minimum: 0 }
            missingDays:
              type: array
              items: { type: string }
            failedWorkspaceDays:
              type: array
              items: { type: string }
        qualifications:
          type: array
          items: { type: string }
        limitObservation:
          type: object
          required: [status, observedAt, lastSuccessfulAt, lastAttemptAt, refreshStartedAt, generation, error]
          properties:
            status:
              type: string
              enum: [complete, failed, unavailable, refreshing]
            observedAt: { type: [integer, "null"] }
            lastSuccessfulAt:
              type: [integer, "null"]
              description: Time of the last authoritative complete observation, retained through later failures.
            lastAttemptAt: { type: [integer, "null"] }
            refreshStartedAt: { type: [integer, "null"] }
            generation:
              type: [string, "null"]
              description: Durable identity of the last successful set of limit values.
            error: { type: [string, "null"] }
    ReportingDetailHeadline:
      type: object
      required: [familyKey, familyName, spendUsd, agentSpendUsd, otherServicesUsd, allocationUsd, remainingUsd, percentUsed, memberCount, membersSpendUsd, unattributedSpendUsd, isComplete]
      properties:
        familyKey: { type: ["string", "null"] }
        familyName: { type: string }
        usageObserved:
          type: boolean
          description: >
            For team reports, false when no mapped workspace has valid usage
            facts in the selected range. Numeric zeroes are then unknown
            accumulators rather than confirmed zero spend.
        spendUsd: { type: number }
        agentSpendUsd: { type: number }
        otherServicesUsd: { type: number }
        allocationUsd:
          type: [number, "null"]
          description: Canonical allocation for a single group; null when a family has no single confidentially-safe denominator.
        remainingUsd:
          type: [number, "null"]
          description: Null when selected-range accounting is incomplete or no safe allocation is available.
        percentUsed: { type: [number, "null"] }
        memberCount: { type: integer, minimum: 0 }
        membersSpendUsd: { type: number }
        unattributedSpendUsd:
          type: number
          description: Authorized group spend not represented by the current visible member rows.
        isComplete: { type: boolean }
    ReportingDetailGroup:
      type: object
      required: [groupId, workspaceId, workspaceName, name, familyKey, familyName, role, isLegacy, memberCount, spendUsd, agentSpendUsd, otherServicesUsd, allocationUsd, remainingUsd, percentUsed, sharedPool]
      properties:
        groupId: { type: string }
        workspaceId: { type: string }
        workspaceName: { type: ["string", "null"] }
        name: { type: string }
        familyKey: { type: string }
        familyName: { type: string }
        role:
          $ref: "#/components/schemas/DirectoryRole"
        isLegacy: { type: boolean }
        memberCount: { type: integer, minimum: 0 }
        spendUsd: { type: number }
        agentSpendUsd: { type: number }
        otherServicesUsd: { type: number }
        allocationUsd: { type: [number, "null"] }
        remainingUsd: { type: [number, "null"] }
        percentUsed: { type: [number, "null"] }
        sharedPool: { type: boolean }
    ReportingDetailMember:
      type: object
      required: [workspaceId, userId, username, email, name, role, isDisabled, isInternal, groupIds, spendUsd, agentSpendUsd, otherServicesUsd, currentCycleAgentSpendUsd, limitUsd, remainingUsd, percentUsed, limitState, limitObservationStatus]
      properties:
        workspaceId: { type: string }
        userId: { type: string }
        username: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        role: { type: ["string", "null"] }
        isDisabled: { type: ["boolean", "null"] }
        isInternal: { type: boolean }
        groupIds:
          type: array
          uniqueItems: true
          items: { type: string }
        spendUsd:
          type: number
          description: Selected-range spend attributed to the requested groups.
        agentSpendUsd: { type: number }
        otherServicesUsd: { type: number }
        currentCycleAgentSpendUsd:
          type: [number, "null"]
          description: Complete current-cycle workspace/user Agent usage; null for incomplete coverage or unknown metric classification.
        limitUsd:
          type: [number, "null"]
          description: Effective persisted workspace/user Agent limit.
        remainingUsd:
          type: [number, "null"]
          description: Workspace/user limit minus current-cycle Agent usage; never selected-range or group-attributed spend.
        percentUsed: { type: [number, "null"] }
        limitState:
          type: string
          enum: [explicit, inherited, no_limit, unavailable]
        limitObservationStatus:
          type: string
          enum: [complete, failed, unavailable, refreshing]
    ReportingDetail:
      type: object
      required: [kind, headline, groups, sourceGroups, members, period, metadata]
      properties:
        kind:
          type: string
          enum: [group, family, team]
        id:
          type: string
          description: Canonical qualified pool ID; present when kind is team.
        name:
          type: string
          description: Canonical pool name; present when kind is team.
        headline:
          $ref: "#/components/schemas/ReportingDetailHeadline"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ReportingDetailGroup"
        sourceGroups:
          type: array
          description: Deduplicated authorized physical role groups represented by the canonical group rows; contains no financial fields.
          items:
            type: object
            required: [groupId, workspaceId, workspaceName, role]
            properties:
              groupId: { type: string }
              workspaceId: { type: string }
              workspaceName: { type: ["string", "null"] }
              role:
                $ref: "#/components/schemas/DirectoryRole"
        members:
          type: array
          items:
            $ref: "#/components/schemas/ReportingDetailMember"
        period:
          $ref: "#/components/schemas/ReportingPeriod"
        metadata:
          $ref: "#/components/schemas/AccountingMetadata"
    DashboardScope:
      type: object
      required: [viewScope, label, workspaceIds, groupIds, isPersonal]
      properties:
        viewScope:
          type: string
          enum: [managed, my, all_authorized]
        label: { type: string }
        workspaceIds:
          type: array
          items: { type: string }
        groupIds:
          type: array
          items: { type: string }
        isPersonal: { type: boolean }
    DashboardCard:
      type: object
      required: [key, label, value, unit, qualification]
      properties:
        key:
          type: string
          enum: [eligible_spend, allocated_budget, allocation_remaining, pools_attention, spend, agent_spend, other_services, members_with_spend, your_agent_spend, monthly_agent_limit, agent_limit_remaining]
        label: { type: string }
        value: { type: [number, "null"] }
        unit:
          type: string
          enum: [usd, count]
        qualification: { type: [string, "null"] }
    DashboardTrendBucket:
      type: object
      required: [start, endExclusive, spendUsd, valueUsd, isPartial, isMissing]
      properties:
        start: { type: string, format: date-time }
        endExclusive: { type: string, format: date-time }
        spendUsd: { type: [number, "null"] }
        valueUsd: { type: [number, "null"] }
        isPartial: { type: boolean }
        isMissing: { type: boolean }
    DashboardBreakdownItem:
      type: object
      required: [id, label, spendUsd, kind, drillThrough]
      properties:
        id: { type: string }
        label: { type: string }
        spendUsd: { type: number }
        kind:
          type: string
          enum: [workspace, group, other, unattributed, reconciliation]
        drillThrough: { type: [string, "null"] }
    DashboardAccounting:
      type: object
      required: [eligibleSpendUsd, grossSpendUsd, internalExcludedUsd, unbudgetedUsd, unattributedUsd, reconciliationUsd, agentSpendUsd, otherServicesUsd]
      properties:
        eligibleSpendUsd: { type: number }
        grossSpendUsd: { type: number }
        internalExcludedUsd: { type: number }
        unbudgetedUsd: { type: number }
        unattributedUsd: { type: number }
        reconciliationUsd: { type: number }
        agentSpendUsd: { type: number }
        otherServicesUsd: { type: number }
    DashboardPersonalLimit:
      type: object
      required: [workspaceId, workspaceName, amount, state, currentCycleAgentSpendUsd, currentCycleRemainingUsd, currentCyclePercentUsed]
      properties:
        workspaceId: { type: string }
        workspaceName: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }
        state:
          type: string
          enum: [explicit, inherited, no_limit, unavailable]
        currentCycleAgentSpendUsd: { type: ["number", "null"] }
        currentCycleRemainingUsd: { type: ["number", "null"] }
        currentCyclePercentUsed: { type: ["number", "null"] }
    DashboardPersonalWorkspaceSpend:
      type: object
      required: [workspaceId, workspaceName, spendUsd, agentSpendUsd, otherServicesUsd, usageObserved, coverage, observedDays, requestedDays, activeProjectCount, publishedProjectCount, projectCountCoverage]
      properties:
        workspaceId: { type: string }
        workspaceName: { type: ["string", "null"] }
        spendUsd: { type: ["number", "null"] }
        agentSpendUsd: { type: ["number", "null"] }
        otherServicesUsd: { type: ["number", "null"] }
        usageObserved: { type: boolean }
        coverage:
          type: string
          enum: [complete, partial, missing]
        observedDays: { type: integer, minimum: 0 }
        requestedDays: { type: integer, minimum: 0 }
        activeProjectCount:
          type: [integer, "null"]
          minimum: 0
          description: Distinct projects with selected-period spend authoritatively attributed to the signed-in creator. Null only when usage or creator metadata is incomplete; deployment metadata does not gate this count.
        publishedProjectCount:
          type: [integer, "null"]
          minimum: 0
          description: Active projects in activeProjectCount that currently have a deployment according to the Enterprise projects hasDeployment filter. This is current state, not historical state for the selected period.
        projectCountCoverage:
          type: string
          enum: [complete, partial, missing]
          description: Qualification for the added current-published count. Active-project count may remain known while this is partial because deployment metadata is still refreshing.
    PersonalProjectCatalog:
      type: object
      required: [projectCount, publishedProjectCount, publicationKnownProjectCount, publicationUnknownProjectCount, coverage, dataAsOf]
      properties:
        projectCount:
          type: integer
          minimum: 0
          description: Current cached catalog projects owned by the signed-in user in their active authorized workspaces, deduplicated by project ID.
        publishedProjectCount:
          type: integer
          minimum: 0
          description: Catalog projects currently known to have a deployment. Consult coverage and publicationUnknownProjectCount before treating this as a complete total.
        publicationKnownProjectCount: { type: integer, minimum: 0 }
        publicationUnknownProjectCount: { type: integer, minimum: 0 }
        coverage:
          type: string
          enum: [complete, partial, missing]
        dataAsOf:
          type: [string, "null"]
          format: date-time
    DashboardProjectionPoint:
      type: object
      required: [date, actualCumulativeUsd, projectedCumulativeUsd, sevenDayScenarioUsd, twentyEightDayScenarioUsd]
      properties:
        date: { type: string, format: date }
        actualCumulativeUsd: { type: [number, "null"] }
        projectedCumulativeUsd: { type: [number, "null"] }
        sevenDayScenarioUsd: { type: [number, "null"] }
        twentyEightDayScenarioUsd: { type: [number, "null"] }
    DashboardProjection:
      type: object
      required: [actualPeriod, target, dataThrough, rate, baseline, budget, projectedTotalUsd, projectedRemainingUsd, projectedOverageUsd, projectedUsePercent, status, stale, reasons, methodology, trajectory]
      properties:
        actualPeriod:
          type: object
          required: [start, endExclusive]
          properties:
            start: { type: string, format: date-time }
            endExclusive: { type: string, format: date-time }
        target:
          type: object
          required: [kind, start, endExclusive, verified]
          properties:
            kind:
              type: string
              enum: [month_end, year_end, term_end, cycle_end, planning_end]
            start: { type: string, format: date-time }
            endExclusive: { type: [string, "null"], format: date-time }
            verified: { type: boolean }
        dataThrough:
          type: [string, "null"]
          format: date
          description: Last UTC day with a known selected-period fact, including a partial fact or a recorded current day. The rate independently excludes today.
        rate:
          type: object
          required: [dailySpendUsd, windowStart, windowEndExclusive, completeDays, sevenDayDailySpendUsd, twentyEightDayDailySpendUsd]
          properties:
            dailySpendUsd: { type: [number, "null"] }
            windowStart: { type: [string, "null"], format: date-time }
            windowEndExclusive: { type: [string, "null"], format: date-time }
            completeDays: { type: integer, minimum: 0, maximum: 28 }
            sevenDayDailySpendUsd: { type: [number, "null"] }
            twentyEightDayDailySpendUsd: { type: [number, "null"] }
        baseline:
          type: object
          required: [spendUsd, complete]
          properties:
            spendUsd: { type: [number, "null"] }
            complete: { type: boolean }
        budget:
          type: [object, "null"]
          required: [amountUsd, kind, label]
          properties:
            amountUsd: { type: number }
            kind:
              type: string
              enum: [canonical_allocation, personal_agent_limit]
            label: { type: string }
        projectedTotalUsd:
          type: [number, "null"]
          description: Selected-period known cumulative spend plus future pace, available only when the entire past baseline is complete.
        projectedKnownTotalUsd:
          type: [number, "null"]
          description: Known selected-period spend plus future pace when incomplete baseline coverage is the only blocker. Missing past days are not estimated; budget comparisons remain unavailable.
        projectedRemainingUsd: { type: [number, "null"] }
        projectedOverageUsd: { type: [number, "null"] }
        projectedUsePercent: { type: [number, "null"] }
        status:
          type: string
          enum: [within, near, over, unavailable]
        stale: { type: boolean }
        reasons:
          type: array
          items:
            type: string
            enum: [historical_reporting_period, invalid_planning_end, unverified_cycle_end, insufficient_rate_history, incomplete_baseline]
        methodology: { type: string }
        trajectory:
          type: array
          maxItems: 400
          items:
            $ref: "#/components/schemas/DashboardProjectionPoint"
    DashboardResponse:
      type: object
      required: [scope, period, cardVariant, cards, trend, breakdown, accounting, metadata, projection, staleSpend]
      properties:
        scope:
          $ref: "#/components/schemas/DashboardScope"
        period:
          $ref: "#/components/schemas/ReportingPeriod"
        cardVariant:
          type: string
          enum: [budget_health, usage_analysis, personal_limit, personal_usage]
        cards:
          type: array
          minItems: 3
          maxItems: 4
          items:
            $ref: "#/components/schemas/DashboardCard"
        trend:
          type: object
          required: [granularity, mode, buckets]
          properties:
            granularity:
              type: string
              enum: [day, week, month]
            mode:
              type: string
              enum: [period, cumulative]
            buckets:
              type: array
              maxItems: 62
              items:
                $ref: "#/components/schemas/DashboardTrendBucket"
        breakdown:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/DashboardBreakdownItem"
        accounting:
          $ref: "#/components/schemas/DashboardAccounting"
        personalLimits:
          type: array
          description: Self-only active-workspace Agent limits and current-cycle usage. Present only when scope.isPersonal is true.
          items:
            $ref: "#/components/schemas/DashboardPersonalLimit"
        personalSpendByWorkspace:
          type: array
          description: Selected-range self-only actual usage by active workspace. Unknown workspaces use null spend rather than a synthetic zero. Present only when scope.isPersonal is true.
          items:
            $ref: "#/components/schemas/DashboardPersonalWorkspaceSpend"
        personalProjectCatalog:
          description: Current self-owned project catalog summary. Present only for personal scope; independent of selected-period active-project analytics.
          $ref: "#/components/schemas/PersonalProjectCatalog"
        metadata:
          $ref: "#/components/schemas/AccountingMetadata"
        projection:
          $ref: "#/components/schemas/DashboardProjection"
        staleSpend:
          $ref: "#/components/schemas/StaleSpendAggregate"
        insights:
          $ref: "#/components/schemas/DashboardInsights"
    DashboardInsightCategory:
      type: object
      required: [key, label, spendUsd, activeUsers]
      properties:
        key: { type: string }
        label: { type: string }
        spendUsd: { type: [number, "null"] }
        activeUsers: { type: [number, "null"] }
    DashboardInsightMonth:
      type: object
      required: [start, endExclusive, spendUsd, agentSpendUsd, otherSpendUsd, activeUsers, isPartial, isMissing]
      properties:
        start: { type: string, format: date-time }
        endExclusive: { type: string, format: date-time }
        spendUsd: { type: [number, "null"] }
        agentSpendUsd: { type: [number, "null"] }
        otherSpendUsd: { type: [number, "null"] }
        activeUsers: { type: [number, "null"] }
        isPartial: { type: boolean }
        isMissing: { type: boolean }
    DashboardInsightSpender:
      type: object
      required: [id, name, spendUsd]
      properties:
        id: { type: string }
        name: { type: string }
        spendUsd: { type: [number, "null"] }
    DashboardInsights:
      type: object
      required: [activeUsers, avgSpendPerActiveUserUsd, activeDays, busiestDay, previousPeriodSpendUsd, changePercent, categories, monthly, topSpenders, projectCount]
      properties:
        activeUsers: { type: [number, "null"] }
        avgSpendPerActiveUserUsd: { type: [number, "null"] }
        activeDays: { type: [number, "null"] }
        busiestDay:
          type: [object, "null"]
          required: [date, spendUsd]
          properties:
            date: { type: string, format: date }
            spendUsd: { type: number }
        previousPeriodSpendUsd: { type: [number, "null"] }
        changePercent: { type: [number, "null"] }
        categories:
          type: array
          items:
            $ref: "#/components/schemas/DashboardInsightCategory"
        monthly:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/DashboardInsightMonth"
        topSpenders:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DashboardInsightSpender"
        projectCount: { type: [number, "null"] }
    ProjectObservationAvailability:
      type: string
      enum: [complete, stale, unavailable]
      description: >
        Complete is a fresh successful cached observation; stale is retained
        last-good data older than the directory freshness policy; unavailable
        means no successful observation exists. This is independent of usage
        coverage.
    ProjectUsageAvailability:
      type: string
      enum: [complete, partial, unavailable]
      description: Qualification of authorized current-UTC-month project usage.
    ProjectDeploymentObservation:
      type: object
      required: [id, url, privacy, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        url:
          type: ["string", "null"]
          description: Reported deployment URL, not a verified uptime claim.
        privacy:
          type: ["string", "null"]
          description: Reported deploymentPrivacy value, or null when absent.
        status:
          type: ["string", "null"]
          description: Reported deployment lifecycle status, or null when absent.
        createdAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time
    StaleSpendEvaluation:
      type: object
      required: [evaluatedAt, staleCutoff, monthStart, monthEndExclusive, availability, coverage]
      properties:
        evaluatedAt:
          type: string
          format: date-time
          description: Stable evaluation instant shared by every row in the response.
        staleCutoff:
          type: string
          format: date-time
          description: evaluatedAt minus exactly 30 elapsed days; equality is stale.
        monthStart:
          type: string
          format: date-time
          description: Inclusive start of the current UTC calendar month.
        monthEndExclusive:
          type: string
          format: date-time
          description: Exclusive start of the next UTC calendar month.
        availability:
          $ref: "#/components/schemas/ProjectUsageAvailability"
        coverage:
          $ref: "#/components/schemas/UsageCoverage"
    SpendProjectRow:
      type: object
      required:
        - id
        - projectId
        - kind
        - name
        - workspaceId
        - workspaceName
        - ownerId
        - ownerName
        - createdAt
        - updatedAt
        - metadataAvailability
        - hasDeployment
        - deploymentAvailability
        - deployments
        - usageObserved
        - spendUsd
        - agentSpendUsd
        - otherServicesUsd
        - allocationUsd
        - remainingUsd
        - percentUsed
        - currentMonthSpendUsd
        - currentMonthUsageAvailability
        - staleButSpending
        - status
        - memberCount
        - limitState
        - limitObservationStatus
        - sharedPool
      properties:
        id:
          type: string
          description: >
            Existing qualified spend-row identity in project:workspaceId:projectId
            form. Retained for table selection, links, and cache compatibility.
        projectId:
          type: string
          description: Raw Enterprise project ID, qualified by workspaceId.
        kind:
          type: string
          enum: [project]
        name:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: ["string", "null"]
        ownerId:
          type: ["string", "null"]
          description: Current cached creatorId (current owner), not ownership history.
        ownerName:
          type: ["string", "null"]
        createdAt:
          type: ["string", "null"]
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time
          description: Project update timestamp; not an activity or audit trail.
        metadataAvailability:
          $ref: "#/components/schemas/ProjectObservationAvailability"
        hasDeployment:
          type: ["boolean", "null"]
          description: >
            Authoritative current result of the cached projects deployment
            observation. Null means it has never been successfully observed.
        isPublished:
          type: ["boolean", "null"]
          deprecated: true
          description: Compatibility alias for hasDeployment.
        deploymentAvailability:
          $ref: "#/components/schemas/ProjectObservationAvailability"
        deployments:
          type: array
          description: >
            All cached deployment observations for this workspace-qualified
            project. Consult deploymentAvailability and hasDeployment before
            interpreting an empty array.
          items:
            $ref: "#/components/schemas/ProjectDeploymentObservation"
        usageObserved:
          type: boolean
          description: Whether selected-range authorized usage has been observed.
        spendUsd:
          type: number
          description: Authorized selected-range spend, not necessarily the full project total.
        agentSpendUsd:
          type: number
        otherServicesUsd:
          type: number
        allocationUsd:
          type: [number, "null"]
          description: Retained SpendTableRow field; normally null for projects.
        remainingUsd:
          type: [number, "null"]
          description: Retained SpendTableRow field; normally null for projects.
        percentUsed:
          type: [number, "null"]
          description: Retained SpendTableRow field; normally null for projects.
        currentCycleAgentSpendUsd:
          type: [number, "null"]
          description: Retained SpendTableRow field; normally null for projects.
        currentCycleRemainingUsd:
          type: [number, "null"]
          description: Retained SpendTableRow field; normally null for projects.
        currentCyclePercentUsed:
          type: [number, "null"]
          description: Retained SpendTableRow field; normally null for projects.
        currentMonthSpendUsd:
          type: ["number", "null"]
          description: >
            Authorized spend in the current UTC calendar month, independent of
            the selected reporting range. Null means unavailable, never zero.
        currentMonthUsageAvailability:
          $ref: "#/components/schemas/ProjectUsageAvailability"
        staleButSpending:
          type: boolean
          description: >
            True only when updatedAt is known and no later than staleCutoff and
            currentMonthSpendUsd is positive. A future or missing timestamp is false.
        status:
          type: string
        memberCount:
          type: [integer, "null"]
          description: Retained SpendTableRow field; normally null for projects.
        limitState:
          type: string
          enum: [not_applicable, explicit, inherited, no_limit, unavailable]
        limitObservationStatus:
          type: string
          enum: [not_applicable, complete, failed, unavailable, refreshing]
        sharedPool:
          type: boolean
        sourceGroupIds:
          type: array
          uniqueItems: true
          description: Retained optional SpendTableRow compatibility field.
          items: { type: string }
    SpendProjectsResponse:
      type: object
      required: [view, scope, period, rows, page, pageSize, totalRows, filteredRows, totals, facets, metadata, staleEvaluation]
      properties:
        view:
          type: string
          enum: [projects]
        scope:
          $ref: "#/components/schemas/DashboardScope"
        period:
          $ref: "#/components/schemas/ReportingPeriod"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SpendProjectRow"
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalRows: { type: integer, minimum: 0 }
        filteredRows: { type: integer, minimum: 0 }
        totals:
          type: object
          required: [spendUsd, agentSpendUsd, otherServicesUsd, allocationUsd, internalExcludedUsd, unbudgetedUsd, unattributedUsd, reconciliationUsd, currentMonthSpendUsd]
          properties:
            spendUsd: { type: number }
            agentSpendUsd: { type: number }
            otherServicesUsd: { type: number }
            allocationUsd: { type: number }
            internalExcludedUsd: { type: number }
            unbudgetedUsd: { type: number }
            unattributedUsd: { type: number }
            reconciliationUsd: { type: number }
            currentMonthSpendUsd:
              type: ["number", "null"]
              description: Sum across the filtered stale/deployment-qualified population, independent of page size.
        facets:
          type: object
          required: [statuses, workspaces]
          properties:
            statuses:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
            workspaces:
              type: array
              items:
                type: object
                required: [id, name, count]
                properties:
                  id: { type: string }
                  name: { type: string }
                  count: { type: integer, minimum: 0 }
        metadata:
          $ref: "#/components/schemas/AccountingMetadata"
        staleEvaluation:
          $ref: "#/components/schemas/StaleSpendEvaluation"
        personalProjectCatalog:
          description: Current self-owned catalog summary. Present only for the personal Projects view.
          $ref: "#/components/schemas/PersonalProjectCatalog"
    ProjectDetailResponse:
      type: object
      required: [scope, period, project, metadata, staleEvaluation]
      properties:
        scope:
          $ref: "#/components/schemas/DashboardScope"
        period:
          $ref: "#/components/schemas/ReportingPeriod"
        project:
          $ref: "#/components/schemas/SpendProjectRow"
        metadata:
          $ref: "#/components/schemas/AccountingMetadata"
        staleEvaluation:
          $ref: "#/components/schemas/StaleSpendEvaluation"
    UserProjectOwner:
      type: object
      required: [userId, username, name, email]
      properties:
        userId: { type: string }
        username: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
    UserOwnedProjectsResponse:
      type: object
