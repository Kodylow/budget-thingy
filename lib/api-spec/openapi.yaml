openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: groups
    description: Enterprise groups and usage
  - name: budgets
    description: Per-group budgets
  - name: teams
    description: Team budgets
  - name: admins
    description: Admin notification emails
  - name: alerts
    description: Alert history and checks
  - name: status
    description: App/system status
  - name: directory
    description: Workspace directory
  - name: limits
    description: Durable workspace member-limit operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/dev-view:
    get:
      tags: [Auth]
      operationId: getDevView
      summary: List development view-as identities
      description: >
        Available only in local development. Returns disabled in all other
        environments. The selected stable directory user ID is sent with
        protected requests in X-Dev-View-As.
      responses:
        '200':
          description: Development view-as status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevViewResponse'
        '503':
          description: The configured Enterprise directory is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevViewUnavailableResponse'
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      description: >
        Returns the signed-in identity together with the resolved Enterprise
        authorization (role and workspace scope). `auth` is null when the request
        is unauthenticated.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/PreviewAsHeader'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    post:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /groups:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all groups with usage and budget state
      description: >
        Returns custom/SCIM groups across all workspaces of the Enterprise account,
        excluding built-in admin/member/guest role groups,
        joined with stored spend for the selected date range, the configured
        budget, and threshold state.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Group list with usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reporting/details/{groupIds}:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getReportingDetail
      tags: [groups]
      summary: Compact group or family reporting detail
      description: >
        Returns the selected-range headline, role-group metadata, and only the
        requested groups' visible members. Current-cycle Agent limit metrics are
        workspace/user scoped and independent of the selected reporting range.
        Projects, history, audits, and the full workspace directory are excluded.
      parameters:
        - name: groupIds
          in: path
          required: true
          description: Comma-separated group IDs. IDs are trimmed, deduplicated, and limited to 32.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Compact authorized reporting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingDetail"
        "400":
          description: Invalid group IDs or reporting range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: A requested group is missing or outside the current scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Stored accounting unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reporting/teams/{poolId}:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getBudgetTeamReport
      tags: [groups]
      summary: Compact read-only budget team report
      description: >
        Returns the canonical authorized team-pool headline and its visible
        mapped physical groups and members. The annual allocation is the
        current effective team budget and is not prorated to the selected
        reporting range.
      parameters:
        - name: poolId
          in: path
          required: true
          description: Canonical qualified pool ID from the authorized pools table (pool:team:...).
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Compact authorized budget team report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportingDetail"
        "400":
          description: Invalid reporting range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The ID is not an authorized canonical team pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Stored accounting unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getGroupDetail
      tags: [groups]
      summary: Group drill-down with per-user usage
      description: >
        Returns one group with its spend for the selected range plus every member
        of the group: allocated budget (platform user limit or workspace default),
        actual usage, remaining budget, percent consumed, and workspace role.
        Usage health describes freshness and coverage of the stored facts.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ScopeGroupIds"
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /groups/{groupId}/projects:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getGroupProjects
      tags: [groups]
      summary: Group project spend drill-down
      description: >
        Returns project-level spend breakdown for a group in the selected date range.
        Usage health describes freshness and coverage of the stored facts.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Project spend breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clusters/{clusterKey}/projects:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getClusterProjects
      tags: [groups]
      summary: Cluster project spend drill-down
      description: >
        Returns creator-attributed project spend for the requested group cluster.
        Every group in the cluster must be visible to the current user.
      parameters:
        - $ref: "#/components/parameters/ClusterKeyPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Cluster project spend breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cluster not found or outside the current workspace scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clusters/{clusterKey}/headline:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getCanonicalClusterHeadline
      tags: [groups]
      summary: Canonical cluster spend headline
      description: Returns member-deduped canonical spend across the requested visible groups.
      parameters:
        - $ref: "#/components/parameters/ClusterKeyPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Canonical cluster headline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterHeadline"
        "400":
          description: Invalid cluster key or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Cluster not found or outside the current workspace scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dashboard:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getDashboard
      tags: [groups]
      summary: Compact scoped dashboard cards and charts
      description: >
        Returns one committed, stored-data dashboard generation. Period boundaries
        and trend buckets are UTC and end-exclusive. This endpoint never refreshes
        upstream limits and does not include people, project, or hierarchy tables.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/TrendGranularity"
        - $ref: "#/components/parameters/TrendMode"
        - $ref: "#/components/parameters/ProjectionHorizon"
        - $ref: "#/components/parameters/PlanningEndDate"
      responses:
        "200":
          description: Compact coherent dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          description: Invalid scope or period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Stored accounting data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spend/pools:
    get:
      operationId: listSpendPools
      tags: [groups]
      summary: List authorized canonical budget pools
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
        - $ref: "#/components/parameters/SpendPage"
        - $ref: "#/components/parameters/SpendPageSize"
      responses:
        "200":
          description: Canonical pool page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendTableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/groups:
    get:
      operationId: listSpendGroups
      tags: [groups]
      summary: List authorized workspace-qualified groups
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
        - $ref: "#/components/parameters/SpendPage"
        - $ref: "#/components/parameters/SpendPageSize"
      responses:
        "200":
          description: Group page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendTableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/people:
    get:
      operationId: listSpendPeople
      tags: [groups]
      summary: List authorized workspace-qualified people usage
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
        - $ref: "#/components/parameters/SpendPage"
        - $ref: "#/components/parameters/SpendPageSize"
      responses:
        "200":
          description: People page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendTableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/projects:
    get:
      operationId: listSpendProjects
      tags: [groups]
      summary: List authorized workspace-qualified project usage
      description: >
        Returns current project identity and lifecycle observations joined to
        authorized selected-range and current-UTC-month usage. Lifecycle
        availability is independent of usage availability. A project is stale
        but spending only when updatedAt is known and is at least 30 elapsed
        days before evaluatedAt, and authorized currentMonthSpendUsd is positive.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/ProjectDeployedOnly"
        - $ref: "#/components/parameters/ProjectStaleButSpending"
        - $ref: "#/components/parameters/ProjectSort"
        - $ref: "#/components/parameters/SpendPage"
        - $ref: "#/components/parameters/SpendPageSize"
      responses:
        "200":
          description: Project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /workspaces/{workspaceId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/PreviewAsHeader"
    get:
      operationId: getWorkspaceProject
      tags: [groups]
      summary: Get an authorized workspace-qualified project
      description: >
        Returns only the current cached project identity, lifecycle and
        authorized spend facts. This read never initiates an Enterprise API
        refresh. The workspace qualifier is part of the identity and prevents
        cross-workspace project-ID guessing.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/ProjectIdPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
      responses:
        "200":
          description: Authorized project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "400":
          description: Invalid reporting range or scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Project not found in the authorized workspace scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Cached project intelligence unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/{userId}/projects:
    parameters:
      - $ref: "#/components/parameters/PreviewAsHeader"
    get:
      operationId: listUserOwnedProjects
      tags: [groups]
      summary: List projects currently owned by an authorized user
      description: >
        Includes cached current-catalog projects with no selected-range spend.
        Ownership is current metadata, not an audit trail. Results are restricted
        to the effective viewer's workspace and presentation scope.
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/ProjectDeployedOnly"
        - $ref: "#/components/parameters/ProjectStaleButSpending"
        - $ref: "#/components/parameters/ProjectSort"
        - $ref: "#/components/parameters/SpendPage"
        - $ref: "#/components/parameters/SpendPageSize"
      responses:
        "200":
          description: Authorized current owned-project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOwnedProjectsResponse"
        "400":
          description: Invalid reporting range, scope, or filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: User not found in the authorized workspace scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Cached project intelligence unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spend/pools.csv:
    get:
      operationId: exportSpendPoolsCsv
      tags: [groups]
      summary: Export the authorized filtered canonical pool rows
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
      responses:
        "200":
          $ref: "#/components/responses/SpendCsv"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/groups.csv:
    get:
      operationId: exportSpendGroupsCsv
      tags: [groups]
      summary: Export the authorized filtered group rows
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
      responses:
        "200":
          $ref: "#/components/responses/SpendCsv"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/people.csv:
    get:
      operationId: exportSpendPeopleCsv
      tags: [groups]
      summary: Export the authorized filtered people rows
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
      responses:
        "200":
          $ref: "#/components/responses/SpendCsv"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/projects.csv:
    get:
      operationId: exportSpendProjectsTableCsv
      tags: [groups]
