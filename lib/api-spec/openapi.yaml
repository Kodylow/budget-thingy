            otherServicesUsd: { type: number }
            allocationUsd: { type: number }
            internalExcludedUsd: { type: number }
            unbudgetedUsd: { type: number }
            unattributedUsd: { type: number }
            reconciliationUsd: { type: number }
        facets:
          type: object
          required: [statuses, workspaces]
          properties:
            statuses:
              type: object
              additionalProperties: { type: integer, minimum: 0 }
            workspaces:
              type: array
              items:
                type: object
                required: [id, name, count]
                properties:
                  id: { type: string }
                  name: { type: string }
                  count: { type: integer, minimum: 0 }
        metadata:
          $ref: "#/components/schemas/AccountingMetadata"
        personalProjectCatalog:
          description: Current self-owned catalog summary. Present only for the personal Projects view.
