          $ref: "#/components/schemas/SpendProjectsResponse"
    StaleSpendAggregate:
      type: object
      required: [spendUsd, projectCount, availability, coverage, evaluatedAt, staleCutoff, monthStart, monthEndExclusive, drillThrough]
      properties:
        spendUsd:
          type: ["number", "null"]
          description: Authorized current-month spend of stale-but-spending projects; null when unavailable.
        projectCount:
          type: ["integer", "null"]
          minimum: 0
        availability:
          $ref: "#/components/schemas/ProjectUsageAvailability"
        coverage:
          $ref: "#/components/schemas/UsageCoverage"
        evaluatedAt: { type: string, format: date-time }
        staleCutoff:
          type: string
          format: date-time
          description: evaluatedAt minus exactly 30 elapsed days; equality is stale.
        monthStart:
          type: string
          format: date-time
          description: Inclusive current UTC calendar-month boundary.
        monthEndExclusive:
          type: string
          format: date-time
          description: Exclusive next UTC calendar-month boundary.
        drillThrough:
          type: ["string", "null"]
          description: >
            Projects-table link preserving effective viewScope and workspace,
            selecting month-to-date and staleButSpending=true.
    SpendTableRow:
      type: object
      required: [id, kind, name, workspaceId, workspaceName, spendUsd, agentSpendUsd, otherServicesUsd, allocationUsd, remainingUsd, percentUsed, status, memberCount, ownerName, limitState, limitObservationStatus, sharedPool]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [pool, group, person, project, unattributed, reconciliation]
        name: { type: string }
        workspaceId: { type: [string, "null"] }
        workspaceName: { type: [string, "null"] }
        usageObserved:
          type: boolean
          description: False when this row has no valid workspace usage observation in the selected range. Numeric usage accumulators then represent no known facts, not confirmed zero; display them as unknown.
        isPublished:
          type: [boolean, "null"]
          description: Current cached deployment state for personal catalog project rows. Null means publication state has not been observed.
        spendUsd: { type: number }
        agentSpendUsd: { type: number }
        otherServicesUsd: { type: number }
        allocationUsd: { type: [number, "null"] }
        remainingUsd: { type: [number, "null"] }
        percentUsed: { type: [number, "null"] }
        currentCycleAgentSpendUsd:
          type: [number, "null"]
          description: Agent spend in the current billing cycle; populated for People independently of the selected reporting range.
        currentCycleRemainingUsd:
          type: [number, "null"]
          description: Current monthly limit minus current-cycle Agent spend; never selected-range spend.
        currentCyclePercentUsed:
          type: [number, "null"]
          description: Current-cycle Agent spend as a percentage of the current monthly limit.
        status: { type: string }
        memberCount: { type: [integer, "null"] }
        ownerName: { type: [string, "null"] }
        limitState:
          type: string
          enum: [not_applicable, explicit, inherited, no_limit, unavailable]
        limitObservationStatus:
          type: string
          enum: [not_applicable, complete, failed, unavailable, refreshing]
          description: Current durable observation state; last successful values may remain visible during refresh or after failure.
        sharedPool: { type: boolean }
        sourceGroupIds:
          type: array
          uniqueItems: true
          description: >
            Complete scope-filtered physical group IDs contributing to a
            canonical team pool. Present only for team-pool rows.
          items: { type: string }
    SpendTableResponse:
      type: object
      required: [view, scope, period, rows, page, pageSize, totalRows, filteredRows, totals, facets, metadata]
      properties:
        view:
