          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberBudgetMutation"
        "400":
          description: Invalid desired budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Workspace or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Replit budget connector request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Replit budget connector is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearWorkspaceMemberBudget
      tags: [directory, budgets]
      summary: Clear a member's desired Agent budget
      description: Account-wide operators only. Clearing an already-unset budget is idempotent.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Desired budget cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberBudgetMutation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Workspace or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Replit budget connector request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Replit budget connector is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /directory/groups:
    get:
      operationId: listDirectoryGroups
      tags: [directory]
      summary: List enterprise groups with their owning workspaces
      description: >
        Returns every custom/SCIM group from the directory cache together with its
        owning workspace. Available only to account administrators and independent
        of usage loading or the selected reporting range.
      responses:
        "200":
          description: Directory group list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryGroupsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Directory unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace-admins:
    get:
      operationId: listWorkspaceAdmins
      tags: [admins]
      summary: List Team admins per family
      description: Returns every canonical family with its Team admins from the directory. Available only to account administrators.
      responses:
        "200":
          description: Group admin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupAdminsItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /alerts:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Alert history
      description: Sent threshold alerts, newest first. Stored spend is the send-time snapshot; current fields use the latest canonical rollup.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /alerts/check:
    post:
      operationId: runAlertCheck
      tags: [alerts]
      summary: Run the budget threshold check now
      description: Evaluates stored daily usage facts and sends any due alert emails immediately without refreshing Enterprise usage.
      responses:
        "200":
          description: Check completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Enterprise API not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /alerts/{alertId}/test:
    post:
      operationId: sendTestAlert
      tags: [alerts]
      summary: Send Kody a test copy of an email activity entry
      description: >
        Sends a fixed-recipient test copy without changing alert activity,
        fired thresholds, or delivery claims.
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Source activity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /alerts/test-email:
    post:
      operationId: sendEmailTestExample
      tags: [alerts]
      summary: Send Kody a predefined threshold-alert example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTestSelection"
      responses:
        "200":
          description: Test delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTestResult"
        "400":
          description: Unsupported example selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /settings/email:
    get:
      operationId: getEmailSettings
      tags: [status]
      summary: Get automated email delivery policy
      description: Returns the persisted global policy for automated budget-alert delivery.
      responses:
        "200":
          description: Email settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateEmailSettings
      tags: [status]
      summary: Update automated email delivery policy
      description: Enables or disables automated budget-alert delivery without affecting fixed-recipient test sends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSettingsUpdate"
      responses:
        "200":
          description: Updated email settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
        "400":
          description: Invalid email settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /status:
    get:
      operationId: getStatus
      tags: [status]
      summary: System status
      description: Enterprise API connectivity, email configuration, and background checker state.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/usage/ingest/cycle:
    post:
      operationId: runUsageIngestCycle
      tags: [status]
      summary: Run one usage ingest cycle
      description: >
        Available only to true Enterprise account administrators. Runs one
        lock-protected live/backfill/reconciliation cycle and returns its result.
      responses:
        "200":
          description: Ingest cycle completed, or another replica held the ingest lock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageIngestCycleResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Usage ingestion is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/usage/ingest/runs/recent:
    get:
      operationId: listRecentUsageIngestRuns
      tags: [status]
      summary: List recent usage ingest runs
      description: Available only to true Enterprise account administrators.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Most recent ingest runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageIngestRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /limits/workspaces/{workspaceId}:
    get:
      operationId: getSetLimitsWorkspace
      tags: [limits]
      summary: Get the composed Set Limits read model
      description: Reads persisted directory, billing-cycle usage, and limit observations without refreshing upstream data.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
      responses:
        "200":
          description: Set Limits workspace model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetLimitsWorkspace"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Workspace not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /limits/operations/prepare:
    post:
      operationId: prepareLimitOperation
      tags: [limits]
      summary: Freeze and review workspace member-limit targets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitOperationPrepareInput" }
      responses:
        "200":
          description: Frozen operation review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitOperation" }
        "400":
          description: Invalid amount or target selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency key was reused for a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /limits/operations/{operationId}/commit:
    post:
      operationId: commitLimitOperation
      tags: [limits]
      summary: Commit an exactly reviewed limit operation
      parameters:
        - $ref: "#/components/parameters/LimitOperationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitOperationCommitInput" }
      responses:
        "202":
          description: Durable operation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitOperation" }
        "400":
          description: Commit does not match the frozen review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Operation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: A selected member already has an active operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /limits/operations/{operationId}:
    get:
      operationId: getLimitOperation
      tags: [limits]
      summary: Get and resume a durable limit operation
      parameters:
        - $ref: "#/components/parameters/LimitOperationIdPath"
      responses:
        "200":
          description: Current operation and per-target status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitOperation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Operation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /limits/operations/{operationId}/retry:
    post:
      operationId: retryLimitOperationTargets
      tags: [limits]
      summary: Retry selected failed or verification-pending targets
      parameters:
        - $ref: "#/components/parameters/LimitOperationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitOperationRetryInput" }
      responses:
        "202":
          description: Eligible targets queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitOperation" }
        "400":
          description: No eligible targets selected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Operation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
components:
  responses:
    SpendCsv:
      description: CSV containing exactly the authorized filtered rows in server sort order.
      headers:
        X-Filtered-Rows:
          schema: { type: integer, minimum: 0 }
        X-Total-Spend-Usd:
          schema: { type: number }
        X-Generation-Id:
          schema: { type: string }
        X-Usage-Range:
          description: UTC end-exclusive committed reporting interval.
          schema: { type: string }
      content:
        text/csv:
          schema: { type: string }
    Unauthorized:
      description: Authentication required — no valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: >
        Authenticated but not authorized (neither account admin nor an enabled
        workspace admin, or attempting an account-admin-only action).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  parameters:
    LimitOperationIdPath:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F-]{36}$'
    WorkspaceIdPath:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    ClusterKeyPath:
      name: clusterKey
      in: path
      required: true
      schema:
        type: string
    TeamNamePath:
      name: teamName
      in: path
      required: true
      description: URL-encoded team name (spaces as %20)
      schema:
        type: string
    RangeType:
      name: rangeType
      in: query
      required: false
      description: Date range for usage. billing = current billing cycle (default), full-term = rolling May 20, 2026 through today, mtd = month to date, ytd = year to date, custom requires startDate and endDate.
      schema:
        type: string
        enum: [billing, full-term, mtd, ytd, custom]
    ViewScope:
      name: viewScope
      in: query
      required: false
      description: Server-resolved presentation scope; managed excludes unrelated self-only grants.
      schema:
        type: string
        enum: [managed, my, all_authorized]
    TrendGranularity:
      name: granularity
      in: query
      required: false
      schema:
        type: string
        enum: [day, week, month]
    TrendMode:
      name: trendMode
      in: query
      required: false
      schema:
        type: string
        enum: [period, cumulative]
    SpendSearch:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    SpendStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [all, over, attention, budgeted, unbudgeted, no_allocation, shared, explicit, inherited, no_limit, unavailable]
    SpendWorkspace:
      name: workspaceId
      in: query
      required: false
      description: Exact authorized workspace facet. Omit to include every workspace in the resolved scope.
      schema:
        type: string
        maxLength: 200
    SpendSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [status, spend_desc, spend_asc, name_asc, name_desc]
    SpendPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    SpendPageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    StartDate:
      name: startDate
      in: query
      required: false
      description: Inclusive UTC start date (YYYY-MM-DD), required when rangeType=custom
      schema:
        type: string
    EndDate:
      name: endDate
      in: query
      required: false
      description: Inclusive UTC end date (YYYY-MM-DD), required when rangeType=custom
      schema:
        type: string
    ScopeGroupIds:
      name: scopeGroupIds
      in: query
      required: false
      description: Optional comma-separated group IDs that define a team-cluster deduplication scope.
      schema:
        type: string
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
    PreviewAsHeader:
      name: X-Preview-As
      in: header
      required: false
      description: Builder-only synthetic authorization view.
      schema:
        type: string
        pattern: '^(workspace_admin|team_admin|member):.+$'
  schemas:
    SetLimitsGroup:
      type: object
      required: [groupId, name, familyName, role, eligibleUserIds]
      properties:
        groupId: { type: string }
        name: { type: string }
        familyName: { type: ["string", "null"] }
        role: { type: ["string", "null"] }
        eligibleUserIds:
          type: array
          items: { type: string, pattern: '^[1-9]\d*$' }
    SetLimitsMember:
      type: object
      required: [userId, username, name, email, role, groupIds, isInternal, isDisabled, eligible, usageUsd, explicitLimitUsd, effectiveLimitUsd, limitState]
      properties:
        userId: { type: string, pattern: '^[1-9]\d*$' }
        username: { type: string }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        role: { type: string }
        groupIds:
          type: array
          items: { type: string }
        isInternal: { type: boolean }
        isDisabled: { type: boolean }
        eligible: { type: boolean }
        usageUsd: { type: ["number", "null"] }
        explicitLimitUsd: { type: ["number", "null"] }
        effectiveLimitUsd: { type: ["number", "null"] }
        limitState:
          type: string
          enum: [explicit, inherited, no_limit, unavailable]
    SetLimitsWorkspace:
      type: object
      required: [workspaceId, workspaceName, canWrite, unavailableReason, billingPeriod, limitObservation, groups, members]
      properties:
        workspaceId: { type: string, pattern: '^[A-Za-z0-9]+$' }
        workspaceName: { type: string }
        canWrite: { type: boolean }
        unavailableReason: { type: ["string", "null"] }
        billingPeriod:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        limitObservation:
          type: object
          required: [status, observedAt, error]
          properties:
            status: { type: string, enum: [available, unavailable, failed] }
            observedAt: { type: ["string", "null"], format: date-time }
            error: { type: ["string", "null"] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/SetLimitsGroup" }
        members:
          type: array
          items: { $ref: "#/components/schemas/SetLimitsMember" }
    LimitOperationPrepareInput:
      type: object
      additionalProperties: false
      required: [workspaceId, amountUsd, userIds, groupIds, idempotencyKey]
      properties:
        workspaceId: { type: string, pattern: '^[A-Za-z0-9]+$' }
        amountUsd: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        userIds:
          type: array
          maxItems: 1000
          items: { type: string, pattern: '^[1-9]\d*$' }
        groupIds:
          type: array
          maxItems: 1000
          items: { type: string, minLength: 1 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    LimitOperationCommitInput:
      type: object
      additionalProperties: false
      required: [reviewFingerprint, amountUsd, userIds]
      properties:
        reviewFingerprint: { type: string, minLength: 64, maxLength: 64 }
        amountUsd: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        userIds:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, pattern: '^[1-9]\d*$' }
    LimitOperationRetryInput:
      type: object
      additionalProperties: false
      required: [userIds, idempotencyKey]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, pattern: '^[1-9]\d*$' }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    LimitTargetAttempt:
      type: object
      required: [at, stage, outcome]
      properties:
        at: { type: string, format: date-time }
        stage: { type: string, enum: [authorization, membership, reconcile, write, verification, audit] }
        outcome: { type: string }
        requestId: { type: ["string", "null"] }
        retryAfterMs: { type: ["integer", "null"] }
        message: { type: ["string", "null"] }
    LimitOperationTarget:
      type: object
      required: [workspaceId, userId, memberName, memberEmail, oldAmountUsd, newAmountUsd, state, attempts, history, errorStage, errorCode, errorMessage, upstreamRequestId, queuedAt, applyingAt, verifiedAt, failedAt]
      properties:
        workspaceId: { type: string }
        userId: { type: string }
        memberName: { type: ["string", "null"] }
        memberEmail: { type: ["string", "null"] }
        oldAmountUsd: { type: ["number", "null"] }
        newAmountUsd: { type: number }
        state: { type: string, enum: [queued, applying, verified, failed, verification_pending] }
        attempts: { type: integer }
        history:
          type: array
          items: { $ref: "#/components/schemas/LimitTargetAttempt" }
        errorStage: { type: ["string", "null"] }
        errorCode: { type: ["string", "null"] }
        errorMessage: { type: ["string", "null"] }
        upstreamRequestId: { type: ["string", "null"] }
        queuedAt: { type: ["string", "null"], format: date-time }
        applyingAt: { type: ["string", "null"], format: date-time }
        verifiedAt: { type: ["string", "null"], format: date-time }
        failedAt: { type: ["string", "null"], format: date-time }
    LimitOperation:
      type: object
      required: [id, workspaceId, state, amountUsd, reviewFingerprint, actorUserId, preparedAt, committedAt, completedAt, counts, targets]
      properties:
        id: { type: string, pattern: '^[0-9a-fA-F-]{36}$' }
        workspaceId: { type: string }
        state: { type: string, enum: [prepared, queued, running, completed] }
        amountUsd: { type: number }
        reviewFingerprint: { type: string }
        actorUserId: { type: string }
        preparedAt: { type: string, format: date-time }
        committedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        counts:
          type: object
          required: [total, queued, applying, verified, failed, verificationPending]
          properties:
            total: { type: integer }
            queued: { type: integer }
            applying: { type: integer }
            verified: { type: integer }
            failed: { type: integer }
            verificationPending: { type: integer }
        targets:
          type: array
          items: { $ref: "#/components/schemas/LimitOperationTarget" }
    ReportingPeriod:
      type: object
      required: [start, endExclusive, timezone, label]
      properties:
        start: { type: string, format: date-time }
        endExclusive: { type: string, format: date-time }
        timezone: { type: string, const: UTC }
        label: { type: string }
    AccountingMetadata:
      type: object
      required: [generationId, costBasis, status, dataAsOf, directoryDataAsOf, stale, coverage, qualifications, limitObservation]
      properties:
        generationId: { type: string }
        costBasis:
          type: string
          enum: [allocation_eligible_committed]
        status:
          type: string
          enum: [complete, stale, partial, empty]
        dataAsOf: { type: [string, "null"], format: date-time }
        directoryDataAsOf: { type: [string, "null"], format: date-time }
        stale: { type: boolean }
        coverage:
          type: object
          required: [ratio, requestedDays, missingDays, failedWorkspaceDays]
          properties:
            ratio: { type: number, minimum: 0, maximum: 1 }
            requestedDays: { type: integer, minimum: 0 }
            missingDays:
              type: array
              items: { type: string }
            failedWorkspaceDays:
              type: array
