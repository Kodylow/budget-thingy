openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: groups
    description: Enterprise groups and usage
  - name: budgets
    description: Per-group budgets
  - name: teams
    description: Team budgets
  - name: admins
    description: Admin notification emails
  - name: alerts
    description: Alert history and checks
  - name: status
    description: App/system status
  - name: directory
    description: Workspace directory
  - name: limits
    description: Durable workspace member-limit operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      description: >
        Returns the signed-in identity together with the resolved Enterprise
        authorization (role and workspace scope). `auth` is null when the request
        is unauthenticated.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - $ref: '#/components/parameters/PreviewAsHeader'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    post:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /groups:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all groups with usage and budget state
      description: >
        Returns custom/SCIM groups across all workspaces of the Enterprise account,
        excluding built-in admin/member/guest role groups,
        joined with stored spend for the selected date range, the configured
        budget, and threshold state.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Group list with usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getGroupDetail
      tags: [groups]
      summary: Group drill-down with per-user usage
      description: >
        Returns one group with its spend for the selected range plus every member
        of the group: allocated budget (platform user limit or workspace default),
        actual usage, remaining budget, percent consumed, and workspace role.
        Usage health describes freshness and coverage of the stored facts.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ScopeGroupIds"
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /groups/{groupId}/projects:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getGroupProjects
      tags: [groups]
      summary: Group project spend drill-down
      description: >
        Returns project-level spend breakdown for a group in the selected date range.
        Usage health describes freshness and coverage of the stored facts.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Project spend breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clusters/{clusterKey}/projects:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getClusterProjects
      tags: [groups]
      summary: Cluster project spend drill-down
      description: >
        Returns creator-attributed project spend for the requested group cluster.
        Every group in the cluster must be visible to the current user.
      parameters:
        - $ref: "#/components/parameters/ClusterKeyPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Cluster project spend breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cluster not found or outside the current workspace scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clusters/{clusterKey}/headline:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getCanonicalClusterHeadline
      tags: [groups]
      summary: Canonical cluster spend headline
      description: Returns member-deduped canonical spend across the requested visible groups.
      parameters:
        - $ref: "#/components/parameters/ClusterKeyPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Canonical cluster headline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterHeadline"
        "400":
          description: Invalid cluster key or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Cluster not found or outside the current workspace scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /summary:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getSummary
      tags: [groups]
      summary: Dashboard summary
      description: >
        Aggregate visible stats across custom groups and budgets for the selected range.
        totalSpendUsd always uses the workspace-aware member-deduped canonical rollup.
        For account-wide callers, the unfiltered Enterprise usage request is returned
        only as reconciliation metadata. Workspace-scoped callers never receive account figures.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getDashboard
      tags: [groups]
      summary: Compact scoped dashboard cards and charts
      description: >
        Returns one committed, stored-data dashboard generation. Period boundaries
        and trend buckets are UTC and end-exclusive. This endpoint never refreshes
        upstream limits and does not include people, project, or hierarchy tables.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/TrendGranularity"
        - $ref: "#/components/parameters/TrendMode"
      responses:
        "200":
          description: Compact coherent dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          description: Invalid scope or period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Stored accounting data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /spend/pools:
    get:
      operationId: listSpendPools
      tags: [groups]
      summary: List authorized canonical budget pools
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
        - $ref: "#/components/parameters/SpendPage"
        - $ref: "#/components/parameters/SpendPageSize"
      responses:
        "200":
          description: Canonical pool page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendTableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/groups:
    get:
      operationId: listSpendGroups
      tags: [groups]
      summary: List authorized workspace-qualified groups
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
        - $ref: "#/components/parameters/SpendPage"
        - $ref: "#/components/parameters/SpendPageSize"
      responses:
        "200":
          description: Group page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendTableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/people:
    get:
      operationId: listSpendPeople
      tags: [groups]
      summary: List authorized workspace-qualified people usage
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
        - $ref: "#/components/parameters/SpendPage"
        - $ref: "#/components/parameters/SpendPageSize"
      responses:
        "200":
          description: People page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendTableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/projects:
    get:
      operationId: listSpendProjects
      tags: [groups]
      summary: List authorized workspace-qualified project usage
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
        - $ref: "#/components/parameters/SpendPage"
        - $ref: "#/components/parameters/SpendPageSize"
      responses:
        "200":
          description: Project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendTableResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/pools.csv:
    get:
      operationId: exportSpendPoolsCsv
      tags: [groups]
      summary: Export the authorized filtered canonical pool rows
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
      responses:
        "200":
          $ref: "#/components/responses/SpendCsv"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/groups.csv:
    get:
      operationId: exportSpendGroupsCsv
      tags: [groups]
      summary: Export the authorized filtered group rows
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
      responses:
        "200":
          $ref: "#/components/responses/SpendCsv"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/people.csv:
    get:
      operationId: exportSpendPeopleCsv
      tags: [groups]
      summary: Export the authorized filtered people rows
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
      responses:
        "200":
          $ref: "#/components/responses/SpendCsv"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /spend/projects.csv:
    get:
      operationId: exportSpendProjectsTableCsv
      tags: [groups]
      summary: Export the authorized filtered project rows
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/ViewScope"
        - $ref: "#/components/parameters/SpendSearch"
        - $ref: "#/components/parameters/SpendStatus"
        - $ref: "#/components/parameters/SpendWorkspace"
        - $ref: "#/components/parameters/SpendSort"
      responses:
        "200":
          $ref: "#/components/responses/SpendCsv"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /trends:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getTrends
      tags: [groups]
      summary: Group and team spending trends
      description: >
        Returns weekly or monthly canonical spend buckets for the selected range.
        Buckets use UTC boundaries and the current bucket is marked partial.
        Usage health describes freshness and coverage of the stored facts.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - name: granularity
          in: query
          required: true
          schema:
            type: string
            enum: [week, month]
        - name: teamNames
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: groupIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Progressive trend series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendsResponse"
        "400":
          description: Invalid trend filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/activity:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: getUserActivity
      tags: [groups]
      summary: List canonical per-user activity
      description: >
        Returns one row per visible member using the same canonical split shown
        in group and cluster member tables: deduplicated member-grouped AI plus
        non-AI project cost attributed to each current creator.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Progressive canonical user activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserActivityResponse"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Enterprise API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /export/users.csv:
    parameters:
      - $ref: '#/components/parameters/PreviewAsHeader'
    get:
      operationId: exportUsersCsv
      tags: [groups]
      summary: Export canonical per-user activity as CSV
      description: >
        Exports the unique members of the explicitly requested visible groups,
        with an internal-user marker and separate eligible AI,
        hosting/non-AI, and total spend columns. Eligible spend excludes
        internal Replit users.
      parameters:
        - name: groupIds
          in: query
          required: true
          description: Comma-separated group IDs from a group or cluster detail page
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: User activity CSV
          headers:
            X-Export-Complete:
              description: Whether all authoritative workspace usage was loaded
              schema:
                type: boolean
            X-Usage-Range:
              description: Resolved range cache key used for the export
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Missing group scope or invalid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Directory unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /usage/account-observation/export:
    get:
      operationId: getAccountUsageObservationExport
      tags: [status]
      summary: Export the latest scheduler-owned account usage observation
      description: >
        Account-admin-only. Reads the latest durable ungrouped Enterprise usage
        observation for the requested billing period. This endpoint never
        triggers ingestion, retry, reconciliation, refresh, or an Enterprise API
        request.
      parameters:
        - name: billingPeriodStart
          in: query
          required: true
          description: Billing-period start date used by scheduled reconciliation
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Downloadable scheduler-owned account usage observation
          headers:
            Content-Disposition:
              description: JSON attachment filename
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUsageObservationExport"
        "400":
          description: Invalid billing-period start date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No scheduler-owned observation exists for the billing period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/export:
    get:
      operationId: exportProjectsCsv
      tags: [groups]
      summary: Export scoped project activity as CSV
      parameters:
        - $ref: '#/components/parameters/PreviewAsHeader'
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
