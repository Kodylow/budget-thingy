    Group:
      type: object
      required: [groupId, workspaceId, workspaceName, name, familyKey, familyName, role, isLegacy, teamName, type, spendLoaded, spendUsd, paceSpendLoaded, paceSpendUsd, projectSpendUsd, rollupSpendLoaded, rollupSpendUsd, rollupMemberCount, monthlyAgentLimitUsd, cycleAgentSpendUsd, agentPercentUsed, agentRemainingUsd, agentBlocked, thresholdsFired, history]
      properties:
        groupId:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: ["string", "null"]
        name:
          type: string
        familyKey:
          type: string
        familyName:
          type: string
        role:
          $ref: "#/components/schemas/DirectoryRole"
        isLegacy:
          type: boolean
        teamName:
          type: ["string", "null"]
          description: Team this group belongs to, null if unassigned
        isLegacyDisplayOnly:
          type: boolean
          description: True when a legacy-workspace same-name group inherits team display membership but is never a group-limit target.
        type:
          type: string
          description: Group type (custom, admin, member, guest)
        isSynthetic:
          type: boolean
          description: True for a generated accounting row rather than a real Enterprise group
        syntheticKind:
          type: string
          enum: [no_group]
          description: Kind of generated accounting row; present only when isSynthetic is true
        memberCount:
          type: ["integer", "null"]
          description: Number of members in the group, null while loading
        rollupMemberCount:
          type: integer
          description: Unique members attributed to this group for team and org rollups
        spendUsd:
          type: number
          description: Eligible per-group spend after internal Replit user exclusions
        spendLoaded:
          type: boolean
        paceSpendUsd:
          type: number
          description: Member-deduplicated spend within the discovered pace period, excluding earlier reporting-cutoff spend
        paceSpendLoaded:
          type: boolean
        projectSpendUsd:
          type: number
          description: Deduplicated project spend attributed to this group
        rollupSpendUsd:
          type: number
          description: Member-deduplicated spend attributed to this group for team and org rollups
        rollupSpendLoaded:
          type: boolean
        spendUpdatedAt:
          type: ["string", "null"]
          description: ISO timestamp when spend was last fetched
        budgetUsd:
          type: ["number", "null"]
          description: Effective budget in USD (from app-level group budget if set), null if not set
        budgetSource:
          type: ["string", "null"]
          description: Where the effective budget comes from ("app"), null if no budget set
        remainingUsd:
          type: ["number", "null"]
          description: budget - spend, null if no budget or spend not loaded
        percentUsed:
          type: ["number", "null"]
          description: spend / budget * 100, null if no budget or spend not loaded
        monthlyAgentLimitUsd:
          type: ["number", "null"]
          description: Current upstream Replit Agent group limit.
        cycleAgentSpendUsd:
          type: ["number", "null"]
          description: Agent spend in the current Replit billing cycle, null when cycle coverage is incomplete.
        agentPercentUsed:
          type: ["number", "null"]
        agentRemainingUsd:
          type: ["number", "null"]
        agentBlocked:
          type: ["boolean", "null"]
          description: Whether the applied Agent limit is reached, null when cycle coverage is incomplete.
        thresholdsFired:
          type: array
          description: Thresholds (50, 75, 90, 100) already alerted this billing period
          items:
            type: integer
        history:
          type: array
          description: Daily spend snapshots for the current billing period, oldest first
          items:
            $ref: "#/components/schemas/SpendPoint"
        projectedSpendUsd:
          type: ["number", "null"]
          description: Linear projection of end-of-period spend, null while loading or too early in the period
    GroupsResponse:
