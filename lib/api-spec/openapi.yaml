          type: integer
        issueCount:
          type: integer
        error:
          type: [string, "null"]
    AdminEmail:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        createdAt:
          type: string
    AdminEmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
    GroupAdminMember:
      type: object
      required: [userId, username]
      properties:
        userId:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
    DirectoryMemberWorkspace:
      type: object
      required: [workspaceId, workspaceName, role, isDisabled, spendLoaded, spendUsd]
      properties:
        workspaceId:
          type: string
        workspaceName:
          type: string
        role:
          type: string
        isDisabled:
          type: boolean
        spendLoaded:
          type: boolean
          description: Whether usage for the selected range is complete enough to present
        spendUsd:
          type: number
          description: Eligible member spend in this workspace for the selected range; internal Replit usage is zero
        reAttributedSpendUsd:
          type: number
          description: Comcast spend folded into this workspace for the selected member and range
    DirectoryMember:
      type: object
      required: [userId, username, name, email, isAccountAdmin, isInternal, workspaces]
      properties:
        userId:
          type: string
        username:
          type: string
        name:
          type: ["string", "null"]
        email:
          type: string
        isAccountAdmin:
          type: boolean
        isInternal:
          type: boolean
          description: Whether this is an internal Replit user whose spend is excluded from eligible accounting
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryMemberWorkspace"
    DirectoryGroup:
      type: object
      required: [groupId, groupName, workspaceId, workspaceName, familyKey, familyName, role, isLegacy, teamName]
      properties:
        groupId:
          type: string
        groupName:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
        familyKey:
          type: string
        familyName:
          type: string
        role:
          $ref: "#/components/schemas/DirectoryRole"
        isLegacy:
          type: boolean
        teamName:
          type: ["string", "null"]
    DirectoryFamilyHierarchy:
      type: object
      required: [familyKey, familyName, isLegacy, groups]
      properties:
        familyKey:
          type: string
        familyName:
          type: string
        isLegacy:
          type: boolean
        groups:
          type: array
          description: Canonical role groups in server-defined role order.
          items:
            $ref: "#/components/schemas/DirectoryGroup"
    DirectoryTeamHierarchy:
      type: object
      required: [teamName, families]
      properties:
        teamName:
          type: ["string", "null"]
        families:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryFamilyHierarchy"
    DirectoryWorkspaceHierarchy:
      type: object
      required: [workspaceId, workspaceName, teams]
      properties:
        workspaceId:
          type: string
        workspaceName:
          type: string
        teams:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryTeamHierarchy"
    DirectoryGroupsResponse:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          description: Server-owned ordered workspace, team, and canonical family hierarchy.
          items:
            $ref: "#/components/schemas/DirectoryWorkspaceHierarchy"
    DirectoryRole:
      type: string
      enum: [admin, member, viewer, guest, unsuffixed]
    GroupAdminsItem:
      type: object
      required: [groupId, groupName, workspaceId, workspaceName, familyKey, familyName, isLegacy, teamName, admins]
      properties:
        groupId:
          type: string
        groupName:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
        teamName:
          type: ["string", "null"]
        familyKey:
          type: string
        familyName:
          type: string
        isLegacy:
          type: boolean
        admins:
          type: array
          items:
            $ref: "#/components/schemas/GroupAdminMember"
    AppAdmin:
      type: object
      required: [userId, email, createdAt]
      properties:
        userId:
          type: string
        email:
          type: ["string", "null"]
        createdAt:
          type: string
        createdBy:
          type: ["string", "null"]
    AppAdminInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          minLength: 1
    Alert:
      type: object
      required:
        [id, entityType, entityId, entityName, alertType, blockedMemberCount, workspaceIds, threshold, spendUsd, budgetUsd, recipients, sentAt, status, currentSpendUsd, currentPercentUsed, currentUsageComplete]
      properties:
        id:
          type: integer
        entityType:
          type: string
          enum: [group, team]
        entityId:
          type: string
        entityName:
          type: string
        alertType:
          type: string
          enum: [allocation_threshold, member_limit_reached]
        blockedMemberCount:
          type: integer
          minimum: 0
        workspaceIds:
          type: array
          items:
            type: string
        threshold:
          type: integer
          description: Threshold percent crossed (50, 75, 90, 100)
        spendUsd:
          type: number
          description: Canonical spend snapshot captured when this delivery was attempted
        budgetUsd:
          type: number
        recipients:
          type: array
          items:
            type: string
        sentAt:
          type: string
        status:
          type: string
          description: sent or failed
        errorMessage:
          type: ["string", "null"]
        dataAsOf:
          type: ["string", "null"]
          description: Exclusive timestamp through which stored usage facts were evaluated
        currentSpendUsd:
          type: ["number", "null"]
          description: Current canonical spend for the entity; null while usage is incomplete
        currentPercentUsed:
          type: ["number", "null"]
          description: Current canonical spend as a percent of the current allocated pool
        currentUsageComplete:
          type: boolean
    EmailTestSelection:
      type: object
      additionalProperties: false
      required: [entityType, threshold]
      properties:
        entityType:
          type: string
          enum: [group, team]
        threshold:
          type: integer
          enum: [50, 75, 90, 100]
    EmailTestResult:
      type: object
      required: [ok, recipient, subject, error, messageId, senderEmail]
      properties:
        ok:
          type: boolean
        recipient:
          type: string
        subject:
          type: string
        error:
          type: ["string", "null"]
        messageId:
          type: ["string", "null"]
        senderEmail:
          type: ["string", "null"]
    CheckResult:
      type: object
      required: [checkedGroups, checkedTeams, alertsSent, evaluatedAt, dataAsOf, skipped, skipReason]
      properties:
        checkedGroups:
          type: integer
        checkedTeams:
          type: integer
        alertsSent:
          type: integer
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        evaluatedAt:
          type: ["string", "null"]
        dataAsOf:
          type: ["string", "null"]
        skipped:
          type: boolean
        skipReason:
          type: ["string", "null"]
    EmailSettings:
      type: object
      required: [automatedEmailEnabled, updatedAt]
      properties:
        automatedEmailEnabled:
          type: boolean
          description: Whether scheduled and manually triggered budget checks may send threshold emails
        updatedAt:
          type: string
          format: date-time
    EmailSettingsUpdate:
      type: object
      additionalProperties: false
      required: [automatedEmailEnabled]
      properties:
        automatedEmailEnabled:
          type: boolean
    SystemStatus:
      type: object
      required:
        [
          enterpriseApiConfigured,
          enterpriseApiOk,
          emailConfigured,
          automatedEmailEnabled,
          checkerIntervalMinutes,
          lastCheckAt,
          lastSuccessfulEvaluationAt,
          lastEvaluatedDataAsOf,
          lastCheckerAttemptAt,
          lastCheckerSkipReason,
          billingPeriodStart,
          billingPeriodEnd,
          billingPeriodLabel,
          billingPeriodFetchedAt,
          billingPeriodFresh,
          billingPeriodFallback,
          billingPeriodDiffersFromReportingCutoff,
          reportingCutoff,
          reportingRangeStart,
          reportingRangeEnd,
          reportingRangeLabel,
          recentRuns,
          remainingBackfillCount,
          currentMonthReconciliation,
          directoryDataAsOf,
          directoryAgeMs,
          rateLimitTelemetry,
        ]
      properties:
        enterpriseApiConfigured:
          type: boolean
          description: Whether REPLIT_ENTERPRISE_API_KEY is set
        enterpriseApiOk:
          type: boolean
          description: Whether the last Enterprise API call succeeded
        enterpriseApiError:
          type: ["string", "null"]
          description: Last Enterprise API error message, if any
        emailConfigured:
          type: boolean
          description: Whether the email connector transport is set up
        automatedEmailEnabled:
          type: boolean
          description: Whether automated budget-alert delivery is enabled by persisted policy
        checkerIntervalMinutes:
          type: integer
        lastCheckAt:
          type: ["string", "null"]
          deprecated: true
          description: Alias for lastSuccessfulEvaluationAt
        lastSuccessfulEvaluationAt:
          type: ["string", "null"]
        lastEvaluatedDataAsOf:
          type: ["string", "null"]
        lastCheckerAttemptAt:
          type: ["string", "null"]
        lastCheckerSkipReason:
          type: ["string", "null"]
        billingPeriodStart:
          type: string
        billingPeriodEnd:
          type: string
        billingPeriodLabel:
          type: string
        billingPeriodFetchedAt:
          type: ["string", "null"]
        billingPeriodFresh:
          type: boolean
        billingPeriodFallback:
          type: boolean
        billingPeriodDiffersFromReportingCutoff:
          type: boolean
        reportingCutoff:
          type: string
        reportingRangeStart:
          type: string
          description: Effective inclusive reporting start after applying the spend cutoff
        reportingRangeEnd:
          type: string
          description: Effective exclusive reporting end, capped at now and the billing-period end
        reportingRangeLabel:
          type: string
          description: Label that describes the effective reporting bounds
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/UsageIngestRun"
        remainingBackfillCount:
          type: integer
        currentMonthReconciliation:
          type: array
          items:
            $ref: "#/components/schemas/UsageReconciliationStatus"
        directoryDataAsOf:
          type: ["string", "null"]
          format: date-time
        directoryAgeMs:
          type: ["integer", "null"]
        rateLimitTelemetry:
          $ref: "#/components/schemas/UsageRateLimitTelemetry"
    UsageIngestReconciliation:
      type: object
      required: [monthStart, scope, scopeId, upstreamUsd, storedUsd, deltaUsd]
      properties:
        monthStart:
          type: string
          format: date
        scope:
          type: string
        scopeId:
          type: string
        upstreamUsd:
          type: number
        storedUsd:
          type: number
        deltaUsd:
          type: number
    UsageReconciliationStatus:
      allOf:
        - $ref: "#/components/schemas/UsageIngestReconciliation"
        - type: object
          required: [checkedAt]
          properties:
            checkedAt:
              type: string
              format: date-time
    UsageRateLimitTelemetry:
      type: object
      required: [peakRequestsPerMinute, lowestRateLimitRemaining]
      properties:
        peakRequestsPerMinute:
          type: integer
        lowestRateLimitRemaining:
          type: ["integer", "null"]
    UsageIngestCycleResult:
      type: object
      required:
        [
          acquired,
          unitsAttempted,
          unitsSucceeded,
          unitsFailed,
          totalCalls,
          durationMs,
          reconciliations,
          remainingBackfillCount,
          peakRequestsPerMinute,
          lowestRateLimitRemaining,
        ]
      properties:
        acquired:
          type: boolean
        unitsAttempted:
          type: integer
        unitsSucceeded:
          type: integer
        unitsFailed:
          type: integer
        totalCalls:
          type: integer
        durationMs:
          type: integer
        reconciliations:
          type: array
          items:
            $ref: "#/components/schemas/UsageIngestReconciliation"
        remainingBackfillCount:
          type: integer
        peakRequestsPerMinute:
          type: integer
        lowestRateLimitRemaining:
          type: ["integer", "null"]
    UsageIngestRun:
      type: object
      required: [id, kind, startedAt, finishedAt, units, calls, failures, error, status]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [live, backfill, reconcile]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        units:
          type: integer
        calls:
          type: integer
        failures:
          type: integer
        error:
          type: ["string", "null"]
        status:
          type: string
          enum: [running, succeeded, partial, failed]
