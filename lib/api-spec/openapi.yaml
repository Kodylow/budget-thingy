        unitsFailed:
          type: integer
        totalCalls:
          type: integer
        durationMs:
          type: integer
        reconciliations:
          type: array
          items:
            $ref: "#/components/schemas/UsageIngestReconciliation"
        remainingBackfillCount:
          type: integer
        peakRequestsPerMinute:
          type: integer
        lowestRateLimitRemaining:
          type: ["integer", "null"]
    UsageIngestRun:
      type: object
      required: [id, kind, startedAt, finishedAt, units, calls, failures, error, remaining, status]
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [live, backfill, reconcile]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        units:
          type: integer
        calls:
          type: integer
        failures:
          type: integer
        error:
          type: ["string", "null"]
        remaining:
          type: ["integer", "null"]
          description: Units remaining in the whole sweep after this run's slice completed
        status:
          type: string
          enum: [running, succeeded, partial, failed]
