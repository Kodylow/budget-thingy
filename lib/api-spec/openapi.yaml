openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: groups
    description: Enterprise groups and usage
  - name: budgets
    description: Per-group budgets
  - name: teams
    description: Team budgets
  - name: admins
    description: Admin notification emails
  - name: alerts
    description: Alert history and checks
  - name: status
    description: App/system status
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      description: >
        Returns the signed-in identity together with the resolved Enterprise
        authorization (role and workspace scope). `auth` is null when the request
        is unauthenticated.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all groups with usage and budget state
      description: >
        Returns custom/SCIM groups across all workspaces of the Enterprise account,
        excluding built-in admin/member/guest role groups,
        joined with spend for the selected date range (loaded progressively under
        the Enterprise API rate limit), the configured budget, and threshold state.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Group list with usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /groups/{groupId}:
    get:
      operationId: getGroupDetail
      tags: [groups]
      summary: Group drill-down with per-user usage
      description: >
        Returns one group with its spend for the selected range plus every member
        of the group: allocated budget (platform user limit or workspace default),
        actual usage, remaining budget, percent consumed, and workspace role.
        Member usage loads progressively; poll while isComplete is false.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /groups/{groupId}/projects:
    get:
      operationId: getGroupProjects
      tags: [groups]
      summary: Group project spend drill-down
      description: >
        Returns project-level spend breakdown for a group in the selected date range.
        Project usage loads progressively; poll while isComplete is false.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Project spend breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clusters/{clusterKey}/projects:
    get:
      operationId: getClusterProjects
      tags: [groups]
      summary: Cluster project spend drill-down
      description: >
        Returns creator-attributed project spend for the requested group cluster.
        Every group in the cluster must be visible to the current user.
      parameters:
        - $ref: "#/components/parameters/ClusterKeyPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Cluster project spend breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupProjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Cluster not found or outside the current workspace scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /clusters/{clusterKey}/headline:
    get:
      operationId: getCanonicalClusterHeadline
      tags: [groups]
      summary: Canonical cluster spend headline
      description: Returns member-deduped canonical spend across the requested visible groups.
      parameters:
        - $ref: "#/components/parameters/ClusterKeyPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Canonical cluster headline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterHeadline"
        "400":
          description: Invalid cluster key or range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Cluster not found or outside the current workspace scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /groups/{groupId}/refresh:
    post:
      operationId: refreshGroupUsage
      tags: [groups]
      summary: Force-refresh one group's usage
      description: Queues a high-priority usage fetch for one group, bypassing cache TTL.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "202":
          description: Refresh queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /usage/retry:
    post:
      operationId: retryUsageSync
      tags: [groups]
      summary: Retry failed or partial dashboard usage scopes
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "202":
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /summary:
    get:
      operationId: getSummary
      tags: [groups]
      summary: Dashboard summary
      description: >
        Aggregate visible stats across custom groups and budgets for the selected range.
        totalSpendUsd always uses the workspace-aware member-deduped canonical rollup.
        For account-wide callers, the unfiltered Enterprise usage request is returned
        only as reconciliation metadata. Workspace-scoped callers never receive account figures.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /trends:
    get:
      operationId: getTrends
      tags: [groups]
      summary: Group and team spending trends
      description: >
        Returns weekly or monthly canonical spend buckets for the selected range.
        Buckets use UTC boundaries and the current bucket is marked partial.
        Usage loads progressively; poll while isComplete is false.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - name: granularity
          in: query
          required: true
          schema:
            type: string
            enum: [week, month]
        - name: teamNames
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: groupIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Progressive trend series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendsResponse"
        "400":
          description: Invalid trend filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /users/activity:
    get:
      operationId: getUserActivity
      tags: [groups]
      summary: List canonical per-user activity
      description: >
        Returns one row per visible member using the same canonical split shown
        in group and cluster member tables: deduplicated member-grouped AI plus
        non-AI project cost attributed to each current creator.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Progressive canonical user activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserActivityResponse"
        "400":
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Enterprise API unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /export/users.csv:
    get:
      operationId: exportUsersCsv
      tags: [groups]
      summary: Export canonical per-user activity as CSV
      description: >
        Exports the same selected-range per-user values returned by User Activity,
        with separate AI, hosting/non-AI, and total spend columns.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: User activity CSV
          headers:
            X-Export-Complete:
              description: Whether all authoritative workspace usage was loaded
              schema:
                type: boolean
            X-Usage-Range:
              description: Resolved range cache key used for the export
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Directory unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: List all configured group budgets
      responses:
        "200":
          description: Budget list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupBudget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /groups/{groupId}/budget:
    put:
      operationId: setGroupBudget
      tags: [budgets]
      summary: Set or update the budget for a group
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupBudgetInput"
      responses:
        "200":
          description: Budget saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupBudget"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteGroupBudget
      tags: [budgets]
      summary: Remove the budget for a group
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "200":
          description: Budget removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No budget configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teams/budgets:
    get:
      operationId: getTeamsBudgets
      tags: [teams]
      summary: List all team budgets
      responses:
        "200":
          description: Team budget list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBudgetsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /teams/{teamName}/budget:
    put:
      operationId: setTeamBudget
      tags: [teams]
      summary: Set or update the budget for a team
      description: teamName must be URL-encoded (spaces as %20).
      parameters:
        - $ref: "#/components/parameters/TeamNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamBudgetInput"
      responses:
        "200":
          description: Budget saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBudget"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteTeamBudget
      tags: [teams]
      summary: Remove the budget override for a team
      description: teamName must be URL-encoded (spaces as %20).
      parameters:
        - $ref: "#/components/parameters/TeamNamePath"
      responses:
        "204":
          description: Budget removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admins:
    get:
      operationId: listAdmins
      tags: [admins]
      summary: List admin notification emails
      responses:
        "200":
          description: Admin email list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEmail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addAdmin
      tags: [admins]
      summary: Add an admin notification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmailInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmail"
        "400":
          description: Invalid or duplicate email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admins/{adminId}:
    delete:
      operationId: deleteAdmin
      tags: [admins]
      summary: Remove an admin notification email
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /editors:
    get:
      operationId: listEditors
      tags: [admins]
      summary: List account-wide app editors
      description: Available only to Enterprise account administrators and the designated account delegate.
      responses:
        "200":
          description: Editor allowlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountEditor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addEditor
      tags: [admins]
      summary: Add an account-wide app editor
      description: Available only to Enterprise account administrators and the designated account delegate. The stable Replit user ID must already have signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountEditorInput"
      responses:
        "201":
          description: Editor added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEditor"
        "400":
          description: Invalid or duplicate editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Replit user has not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /editors/{userId}:
    delete:
      operationId: deleteEditor
      tags: [admins]
      summary: Remove an account-wide app editor
      description: Available only to Enterprise account administrators and the designated account delegate.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Editor removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workspace-admins:
    get:
      operationId: listWorkspaceAdmins
      tags: [admins]
      summary: List admins per group
      description: Returns every custom group with its workspace admin users from the directory. Available only to account administrators.
      responses:
        "200":
          description: Group admin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupAdminsItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Alert history
      description: Sent threshold alerts, newest first. Stored spend is the send-time snapshot; current fields use the latest canonical rollup.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /alerts/check:
    post:
      operationId: runAlertCheck
      tags: [alerts]
      summary: Run the budget threshold check now
      description: Refreshes usage for all budgeted groups and sends any due alert emails immediately.
      responses:
        "200":
          description: Check completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Enterprise API not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /alerts/{alertId}/test:
    post:
      operationId: sendTestAlert
      tags: [alerts]
      summary: Send a test copy of an email activity entry
      description: >
        Re-resolves current RBAC recipients and sends a test copy without
        changing fired thresholds or delivery claims.
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test delivery activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Source activity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /status:
    get:
      operationId: getStatus
      tags: [status]
      summary: System status
      description: Enterprise API connectivity, email configuration, and background checker state.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /usage/ranges/rebuild:
    post:
      operationId: rebuildUsageRange
      tags: [status]
      summary: Rebuild one usage range
      description: >
        Account-admin-only control that queues a complete, transaction-safe
        rebuild of the selected range without changing any other cached range.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageRangeRebuildInput"
      responses:
        "202":
          description: Full range rebuild queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  responses:
    Unauthorized:
      description: Authentication required — no valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: >
        Authenticated but not authorized (neither account admin nor an enabled
        workspace admin, or attempting an account-admin-only action).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  parameters:
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    ClusterKeyPath:
      name: clusterKey
      in: path
      required: true
      schema:
        type: string
    TeamNamePath:
      name: teamName
      in: path
      required: true
      description: URL-encoded team name (spaces as %20)
      schema:
        type: string
    RangeType:
      name: rangeType
      in: query
      required: false
      description: Date range for usage. billing = current billing cycle (default), mtd = month to date, ytd = year to date, custom requires startDate and endDate.
      schema:
        type: string
        enum: [billing, mtd, ytd, custom]
    StartDate:
      name: startDate
      in: query
      required: false
      description: Inclusive UTC start date (YYYY-MM-DD), required when rangeType=custom
      schema:
        type: string
    EndDate:
      name: endDate
      in: query
      required: false
      description: Inclusive UTC end date (YYYY-MM-DD), required when rangeType=custom
      schema:
        type: string
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthAuthorization:
      type: object
      description: >
        Resolved authorization for the signed-in user. account_admin,
        account_delegate, and account_editor see the whole account;
        workspace_admin sees only the listed workspaces. account_admin and
        account_delegate can manage editor access and settings.
      required: [role, workspaceIds]
      properties:
        role:
          type: string
          enum: [account_admin, account_delegate, account_editor, workspace_admin]
          description: Effective role resolved from the Enterprise directory and managed editor allowlist.
        workspaceIds:
          type: array
          description: >
            Workspace IDs the user may view. Empty and ignored for account_admin,
            account_delegate, and account_editor; the union of admin workspaces
            for workspace_admin.
          items:
            type: string
    AuthUserEnvelope:
      type: object
      required: [user, auth]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
        auth:
          description: >
            Resolved authorization, or null when the user is unauthenticated or
            is neither an account admin nor an enabled workspace admin (access denied).
          oneOf:
            - $ref: '#/components/schemas/AuthAuthorization'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    SpendPoint:
      type: object
      required: [date, spendUsd]
      properties:
        date:
          type: string
          description: UTC day of the snapshot (YYYY-MM-DD)
        spendUsd:
          type: number
    Group:
      type: object
      required: [groupId, workspaceId, name, type, spendLoaded, paceSpendLoaded, rollupSpendLoaded, rollupSpendUsd, rollupMemberCount, thresholdsFired, history]
      properties:
        groupId:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: ["string", "null"]
        name:
          type: string
        teamName:
          type: ["string", "null"]
          description: Team this group belongs to, null if unassigned
        type:
          type: string
          description: Group type (custom, admin, member, guest)
        isSynthetic:
          type: boolean
          description: True for a generated accounting row rather than a real Enterprise group
        syntheticKind:
          type: string
          enum: [no_group]
          description: Kind of generated accounting row; present only when isSynthetic is true
        memberCount:
          type: ["integer", "null"]
          description: Number of members in the group, null while loading
        rollupMemberCount:
          type: integer
          description: Unique members attributed to this group for team and org rollups
        spendLoaded:
          type: boolean
          description: Whether spend for the current billing period has been fetched yet
        spendUsd:
          type: ["number", "null"]
          description: Raw per-group spend reported by the Enterprise API, null while loading
        paceSpendLoaded:
          type: boolean
          description: Whether usage bounded to the discovered pace period is complete
        paceSpendUsd:
          type: ["number", "null"]
          description: Member-deduplicated spend within the discovered pace period, excluding earlier reporting-cutoff spend
        projectSpendLoaded:
          type: boolean
          description: Whether project usage for every visible custom group is loaded
        projectSpendUsd:
          type: ["number", "null"]
          description: Deduplicated project spend attributed to this group, null while project usage is loading
        rollupSpendLoaded:
          type: boolean
          description: Whether member-level usage for every custom group is loaded
        rollupSpendUsd:
          type: number
          description: Member-deduplicated spend attributed to this group for team and org rollups
        spendUpdatedAt:
          type: ["string", "null"]
          description: ISO timestamp when spend was last fetched
        budgetUsd:
          type: ["number", "null"]
          description: Effective budget in USD (from app-level group budget if set), null if not set
        budgetSource:
          type: ["string", "null"]
          description: Where the effective budget comes from ("app"), null if no budget set
        remainingUsd:
          type: ["number", "null"]
          description: budget - spend, null if no budget or spend not loaded
        percentUsed:
          type: ["number", "null"]
          description: spend / budget * 100, null if no budget or spend not loaded
        thresholdsFired:
          type: array
          description: Thresholds (50, 75, 90, 100) already alerted this billing period
          items:
            type: integer
        history:
          type: array
          description: Daily spend snapshots for the current billing period, oldest first
          items:
            $ref: "#/components/schemas/SpendPoint"
        projectedSpendUsd:
          type: ["number", "null"]
          description: Linear projection of end-of-period spend, null while loading or too early in the period
    GroupsResponse:
      type: object
      required: [groups, isComplete, syncStatus, pendingCount, failedCount, partialCount, billingPeriodLabel, projectSpendLoaded, unattributedProjectSpendUsd, teamRawSpend]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        isComplete:
          type: boolean
          description: False while background usage fetches are still pending; poll every ~8s until true
        syncStatus:
          type: string
          enum: [complete, syncing, partial, failed]
        syncError:
          type: ["string", "null"]
        failedCount:
          type: integer
        partialCount:
          type: integer
        pendingCount:
          type: integer
          description: Number of outstanding workspace, member, project-usage, or project-metadata inputs
        billingPeriodLabel:
          type: string
          description: Human label of the selected range, e.g. "Jul 2026" or "Year to date"
        projectSpendLoaded:
          type: boolean
          description: True when project usage for every visible custom group is loaded
        unattributedProjectSpendUsd:
          type: number
          description: True project attribution residual from rows without project IDs, missing creators, or creators who are no longer current members
        teamRawSpend:
          type: object
          additionalProperties:
            type: object
            required: [spendUsd, spendLoaded]
            properties:
              spendUsd:
                type: number
                description: Member-deduped rollup spend for this team (sum of rollup.byGroup across all groups in the team)
              spendLoaded:
                type: boolean
                description: True when member-level usage for every visible custom group is loaded
          description: Per-team member-deduped rollup spend, with each member counted once across groups
    TrendSeries:
      type: object
      required: [name, type, data]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [team, group]
        data:
          type: array
          items:
            type: ["number", "null"]
          description: Spend in USD for each corresponding bucket; null while loading
    TrendBucketRange:
      type: object
      required: [start, end, isPartial]
      properties:
        start:
          type: string
        end:
          type: string
        isPartial:
          type: boolean
          description: True only for an open bucket containing the current UTC day
    TrendsResponse:
      type: object
      required: [buckets, bucketRanges, totals, series, isComplete, loadedCount, totalCount]
      properties:
        buckets:
          type: array
          items:
            type: string
          description: ISO date for the start of each bucket
        bucketRanges:
          type: array
          items:
            $ref: "#/components/schemas/TrendBucketRange"
        totals:
          type: array
          items:
            type: ["number", "null"]
          description: Canonical scoped spend for each bucket; null while loading
        series:
          type: array
          items:
            $ref: "#/components/schemas/TrendSeries"
        isComplete:
          type: boolean
        loadedCount:
          type: integer
        totalCount:
          type: integer
    ClusterHeadline:
      type: object
      required: [spendUsd, isComplete, pendingCount]
      properties:
        spendUsd:
          type: ["number", "null"]
          description: Canonical member-deduped cluster spend; null until the scoped rollup is complete
        isComplete:
          type: boolean
        pendingCount:
          type: integer
    GroupMember:
      type: object
      required: [userId, spendLoaded, aiSpendUsd, nonAiSpendUsd]
      properties:
        userId:
          type: string
        username:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
          description: Full name if available
        role:
          type: ["string", "null"]
          description: Workspace role (admin, member, viewer, guest)
        isDisabled:
          type: ["boolean", "null"]
          description: Whether the member's workspace access is disabled
        allocatedBudgetUsd:
          type: ["number", "null"]
          description: Not used; always null (budgets are tracked at team level from the spreadsheet)
        budgetSource:
          type: ["string", "null"]
          description: Not used; always null
        spendLoaded:
          type: boolean
        spendUsd:
          type: ["number", "null"]
          description: Canonical total of member-grouped AI plus creator-attributed project non-AI for this group
        aiSpendUsd:
          type: ["number", "null"]
          description: Deduplicated member-grouped AI spend for this user in the group
        nonAiSpendUsd:
          type: ["number", "null"]
          description: Non-AI project spend attributed to projects this current member created
        remainingUsd:
          type: ["number", "null"]
        percentUsed:
          type: ["number", "null"]
    ProjectMetric:
      type: object
      required: [id, name, category, costUsd]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          description: "Metric category: ai, hosting, storage, or other"
        costUsd:
          type: number
    GroupProject:
      type: object
      required: [projectId, title, totalCostUsd, aiSpendUsd, nonAiSpendUsd, creatorId, creatorName, creatorIsCurrentMember, metrics, workspaceId, workspaceName]
      properties:
        projectId:
          type: string
        title:
          type: ["string", "null"]
          description: Project title, or null if untitled
        totalCostUsd:
          type: number
        aiSpendUsd:
          type: number
          description: AI-category metrics included in this project's total
        nonAiSpendUsd:
          type: number
          description: Authoritative project total minus AI-category metrics
        creatorId:
          type: ["string", "null"]
        creatorName:
          type: ["string", "null"]
        creatorIsCurrentMember:
          type: boolean
          description: Whether this project's non-AI cost can be attributed to its creator
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMetric"
        workspaceId:
          type: ["string", "null"]
          description: Workspace the project belongs to, null when unknown
        workspaceName:
          type: ["string", "null"]
          description: Human-readable workspace name, null when unknown
    GroupProjectsResponse:
      type: object
      required: [projects, unattributedSpendUsd, isComplete]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/GroupProject"
        unattributedSpendUsd:
          type: number
          description: Group spend not attributable to any returned project row
        isComplete:
          type: boolean
          description: False while project usage is still loading; poll every ~8s until true
    GroupDetail:
      type: object
      required: [group, members, isComplete, rangeLabel, membersSpendUsd, unattributedSpendUsd]
      properties:
        group:
          $ref: "#/components/schemas/Group"
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
        membersSpendUsd:
          type: number
          description: Sum of canonical per-user rows currently listed; informational and not a group budget accounting total
        unattributedSpendUsd:
          type: number
          description: True residual from rows without a project ID, missing creators, and creators who are no longer current group members
        isComplete:
          type: boolean
          description: False while member usage is still loading; poll every ~8s until true
        rangeLabel:
          type: string
    UserActivityEntry:
      type: object
      required: [userId, username, email, teamName, groupName, spendUsd, aiSpendUsd, nonAiSpendUsd, workspaceRole]
      properties:
        userId:
          type: string
        username:
          type: string
        email:
          type: string
        teamName:
          type: string
        groupName:
          type: string
        spendUsd:
          type: number
          description: Canonical member AI plus creator-attributed project non-AI for the selected range
        aiSpendUsd:
          type: number
          description: Deduplicated member-grouped AI spend
        nonAiSpendUsd:
          type: number
          description: Non-AI spend from deduplicated projects created by this current member
        workspaceRole:
          type: string
    UserActivityResponse:
      type: object
      required: [isComplete, loadedCount, totalCount, users]
      properties:
        isComplete:
          type: boolean
        loadedCount:
          type: integer
          description: Authoritative workspace usage scopes currently loaded
        totalCount:
          type: integer
          description: Authoritative workspace usage scopes in the caller's visibility
        users:
          type: array
          items:
            $ref: "#/components/schemas/UserActivityEntry"
    Summary:
      type: object
      required:
        [
          totalGroups,
          budgetedGroups,
          totalSpendUsd,
          accountUsageTotalSpendUsd,
          accountUsageAttributableSpendUsd,
          accountUsageUnattributableSpendUsd,
          reconciliationSpendUsd,
          totalBudgetUsd,
          groupsOver50,
          groupsOver75,
          groupsOver90,
          groupsOver100,
          alertsSentThisPeriod,
          billingPeriodLabel,
          pacePeriodStart,
          pacePeriodEnd,
          pacePeriodLabel,
          pacePeriodIsFallback,
          isComplete,
          syncStatus,
          pendingCount,
          failedCount,
          partialCount,
        ]
      properties:
        totalGroups:
          type: integer
        budgetedGroups:
          type: integer
        totalSpendUsd:
          type: number
          description: Workspace-aware member-deduped canonical rollup total for the caller's scope
        memberBasedTotalSpendUsd:
          type: number
          description: Member-deduped rollup including extra-workspace-only users not assigned to any group; retained for backward compatibility
        accountUsageTotalSpendUsd:
          type: [number, "null"]
          description: Unfiltered Enterprise usage total for account-wide callers; null while loading and for workspace-scoped callers
        accountUsageAttributableSpendUsd:
          type: [number, "null"]
          description: Attributable portion of the unfiltered account usage anchor; null outside account-wide scope
        accountUsageUnattributableSpendUsd:
          type: [number, "null"]
          description: Unattributable portion of the unfiltered account usage anchor; null outside account-wide scope
        reconciliationSpendUsd:
          type: [number, "null"]
          description: Account anchor minus the exact top-level team and unassigned-group rows displayed by the dashboard; null outside account-wide scope or while loading
        totalBudgetUsd:
          type: number
          description: Sum of all effective group budgets (app or platform)
        totalRemainingUsd:
          type: number
          description: Sum of remaining budget across budgeted groups with loaded spend
        groupsOver50:
          type: integer
        groupsOver75:
          type: integer
        groupsOver90:
          type: integer
        groupsOver100:
          type: integer
        alertsSentThisPeriod:
          type: integer
        billingPeriodLabel:
          type: string
        pacePeriodStart:
          type: string
          description: Inclusive period start used for dashboard pace projections
        pacePeriodEnd:
          type: string
          description: Exclusive period end used for dashboard pace projections
        pacePeriodLabel:
          type: string
        pacePeriodIsFallback:
          type: boolean
          description: True when pace uses the fixed safe fallback because no discovered interval is available
        isComplete:
          type: boolean
        syncStatus:
          type: string
          enum: [complete, syncing, partial, failed]
        syncError:
          type: ["string", "null"]
        pendingCount:
          type: integer
        failedCount:
          type: integer
        partialCount:
          type: integer
    UsageRangeRebuildInput:
      type: object
      required: [rangeType]
      properties:
        rangeType:
          type: string
          enum: [billing, mtd, ytd, custom]
        startDate:
          type: string
        endDate:
          type: string
    GroupBudget:
      type: object
      required: [groupId, amountUsd, updatedAt]
      properties:
        groupId:
          type: string
        amountUsd:
          type: number
        updatedAt:
          type: string
    GroupBudgetInput:
      type: object
      required: [amountUsd]
      properties:
        amountUsd:
          type: number
          exclusiveMinimum: 0
    TeamBudget:
      type: object
      required: [teamName, amountUsd, workspaceIds]
      properties:
        teamName:
          type: string
        amountUsd:
          type: ["number", "null"]
        workspaceIds:
          type: array
          description: Visible workspaces containing groups assigned to this team.
          items:
            type: string
    TeamBudgetsResponse:
      type: object
      required: [budgets]
      properties:
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/TeamBudget"
    TeamBudgetInput:
      type: object
      required: [amountUsd]
      properties:
        amountUsd:
          type: number
          minimum: 0
    AdminEmail:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        createdAt:
          type: string
    AdminEmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
    GroupAdminMember:
      type: object
      required: [userId, username]
      properties:
        userId:
          type: string
        username:
          type: string
        email:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
    GroupAdminsItem:
      type: object
      required: [groupId, groupName, workspaceId, workspaceName, admins]
      properties:
        groupId:
          type: string
        groupName:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
        teamName:
          type: ["string", "null"]
        admins:
          type: array
          items:
            $ref: "#/components/schemas/GroupAdminMember"
    AccountEditor:
      type: object
      required: [userId, email, createdAt]
      properties:
        userId:
          type: string
        email:
          type: ["string", "null"]
        createdAt:
          type: string
        createdBy:
          type: ["string", "null"]
    AccountEditorInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          minLength: 1
    Alert:
      type: object
      required:
        [id, entityType, entityId, entityName, workspaceIds, threshold, spendUsd, budgetUsd, recipients, sentAt, status, currentSpendUsd, currentPercentUsed, currentUsageComplete]
      properties:
        id:
          type: integer
        entityType:
          type: string
          enum: [group, team]
        entityId:
          type: string
        entityName:
          type: string
        workspaceIds:
          type: array
          items:
            type: string
        threshold:
          type: integer
          description: Threshold percent crossed (50, 75, 90, 100)
        spendUsd:
          type: number
          description: Canonical spend snapshot captured when this delivery was attempted
        budgetUsd:
          type: number
        recipients:
          type: array
          items:
            type: string
        sentAt:
          type: string
        status:
          type: string
          description: sent or failed
        errorMessage:
          type: ["string", "null"]
        currentSpendUsd:
          type: ["number", "null"]
          description: Current canonical spend for the entity; null while usage is incomplete
        currentPercentUsed:
          type: ["number", "null"]
          description: Current canonical spend as a percent of the current allocated pool
        currentUsageComplete:
          type: boolean
    CheckResult:
      type: object
      required: [checkedGroups, checkedTeams, alertsSent]
      properties:
        checkedGroups:
          type: integer
        checkedTeams:
          type: integer
        alertsSent:
          type: integer
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
    SystemStatus:
      type: object
      required:
        [
          enterpriseApiConfigured,
          enterpriseApiOk,
          emailConfigured,
          checkerIntervalMinutes,
          billingPeriodStart,
          billingPeriodEnd,
          billingPeriodLabel,
          billingPeriodFetchedAt,
          billingPeriodFresh,
          billingPeriodFallback,
          billingPeriodDiffersFromReportingCutoff,
          reportingCutoff,
        ]
      properties:
        enterpriseApiConfigured:
          type: boolean
          description: Whether REPLIT_ENTERPRISE_API_KEY is set
        enterpriseApiOk:
          type: boolean
          description: Whether the last Enterprise API call succeeded
        enterpriseApiError:
          type: ["string", "null"]
          description: Last Enterprise API error message, if any
        emailConfigured:
          type: boolean
          description: Whether the email connector is set up
        checkerIntervalMinutes:
          type: integer
        lastCheckAt:
          type: ["string", "null"]
        billingPeriodStart:
          type: string
        billingPeriodEnd:
          type: string
        billingPeriodLabel:
          type: string
        billingPeriodFetchedAt:
          type: ["string", "null"]
        billingPeriodFresh:
          type: boolean
        billingPeriodFallback:
          type: boolean
        billingPeriodDiffersFromReportingCutoff:
