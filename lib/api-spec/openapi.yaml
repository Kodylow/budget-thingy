      description: >
        Resolved roles and the union of their server-derived scopes.
      required: [role, roles, workspaceIds, teamNames, groupIds, userIds, isPreview, authorizationRevision]
      properties:
        role:
          type: string
          enum: [account, workspace_admin, team_admin, member]
