openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: groups
    description: Enterprise groups and usage
  - name: budgets
    description: Per-group budgets
  - name: teams
    description: Team budgets
  - name: admins
    description: Admin notification emails
  - name: alerts
    description: Alert history and checks
  - name: status
    description: App/system status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all groups with usage and budget state
      description: >
        Returns custom/SCIM groups across all workspaces of the Enterprise account,
        excluding built-in admin/member/guest role groups,
        joined with spend for the selected date range (loaded progressively under
        the Enterprise API rate limit), the configured budget, and threshold state.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Group list with usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsResponse"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /groups/{groupId}:
    get:
      operationId: getGroupDetail
      tags: [groups]
      summary: Group drill-down with per-user usage
      description: >
        Returns one group with its spend for the selected range plus every member
        of the group: allocated budget (platform user limit or workspace default),
        actual usage, remaining budget, percent consumed, and workspace role.
        Member usage loads progressively; poll while isComplete is false.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "404":
          description: Group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Enterprise API not configured or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /groups/{groupId}/refresh:
    post:
      operationId: refreshGroupUsage
      tags: [groups]
      summary: Force-refresh one group's usage
      description: Queues a high-priority usage fetch for one group, bypassing cache TTL.
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "202":
          description: Refresh queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /summary:
    get:
      operationId: getSummary
      tags: [groups]
      summary: Dashboard summary
      description: >
        Aggregate account-level stats across custom groups and budgets for the selected
        range. Spend is deduplicated at member level: groups are ordered by workspace,
        case-insensitive group name, then ID, and each member is attributed to the first
        custom group in which their usage appears.
      parameters:
        - $ref: "#/components/parameters/RangeType"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: List all configured group budgets
      responses:
        "200":
          description: Budget list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupBudget"
  /groups/{groupId}/budget:
    put:
      operationId: setGroupBudget
      tags: [budgets]
      summary: Set or update the budget for a group
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupBudgetInput"
      responses:
        "200":
          description: Budget saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupBudget"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteGroupBudget
      tags: [budgets]
      summary: Remove the budget for a group
      parameters:
        - $ref: "#/components/parameters/GroupIdPath"
      responses:
        "200":
          description: Budget removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: No budget configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /teams/budgets:
    get:
      operationId: getTeamsBudgets
      tags: [teams]
      summary: List all team budgets
      responses:
        "200":
          description: Team budget list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBudgetsResponse"
  /teams/{teamName}/budget:
    put:
      operationId: setTeamBudget
      tags: [teams]
      summary: Set or update the budget for a team
      description: teamName must be URL-encoded (spaces as %20).
      parameters:
        - $ref: "#/components/parameters/TeamNamePath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamBudgetInput"
      responses:
        "200":
          description: Budget saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamBudget"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteTeamBudget
      tags: [teams]
      summary: Remove the budget override for a team
      description: teamName must be URL-encoded (spaces as %20).
      parameters:
        - $ref: "#/components/parameters/TeamNamePath"
      responses:
        "204":
          description: Budget removed
  /admins:
    get:
      operationId: listAdmins
      tags: [admins]
      summary: List admin notification emails
      responses:
        "200":
          description: Admin email list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminEmail"
    post:
      operationId: addAdmin
      tags: [admins]
      summary: Add an admin notification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmailInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmail"
        "400":
          description: Invalid or duplicate email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admins/{adminId}:
    delete:
      operationId: deleteAdmin
      tags: [admins]
      summary: Remove an admin notification email
      parameters:
        - name: adminId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Alert history
      description: Sent threshold alerts, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
  /alerts/check:
    post:
      operationId: runAlertCheck
      tags: [alerts]
      summary: Run the budget threshold check now
      description: Refreshes usage for all budgeted groups and sends any due alert emails immediately.
      responses:
        "200":
          description: Check completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResult"
        "503":
          description: Enterprise API not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /status:
    get:
      operationId: getStatus
      tags: [status]
      summary: System status
      description: Enterprise API connectivity, email configuration, and background checker state.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
components:
  parameters:
    GroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    TeamNamePath:
      name: teamName
      in: path
      required: true
      description: URL-encoded team name (spaces as %20)
      schema:
        type: string
    RangeType:
      name: rangeType
      in: query
      required: false
      description: Date range for usage. billing = current billing cycle (default), mtd = month to date, ytd = year to date, custom requires startDate and endDate.
      schema:
        type: string
        enum: [billing, mtd, ytd, custom]
    StartDate:
      name: startDate
      in: query
      required: false
      description: Inclusive UTC start date (YYYY-MM-DD), required when rangeType=custom
      schema:
        type: string
    EndDate:
      name: endDate
      in: query
      required: false
      description: Inclusive UTC end date (YYYY-MM-DD), required when rangeType=custom
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    Group:
      type: object
      required: [groupId, workspaceId, name, type, spendLoaded, rollupSpendLoaded, rollupSpendUsd, rollupMemberCount, thresholdsFired]
      properties:
        groupId:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: ["string", "null"]
        name:
          type: string
        teamName:
          type: ["string", "null"]
          description: Team this group belongs to, null if unassigned
        type:
          type: string
          description: Group type (custom, admin, member, guest)
        memberCount:
          type: ["integer", "null"]
          description: Number of members in the group, null while loading
        rollupMemberCount:
          type: integer
          description: Unique members attributed to this group for team and org rollups
        spendLoaded:
          type: boolean
          description: Whether spend for the current billing period has been fetched yet
        spendUsd:
          type: ["number", "null"]
          description: Raw per-group spend reported by the Enterprise API, null while loading
        rollupSpendLoaded:
          type: boolean
          description: Whether member-level usage for every custom group is loaded
        rollupSpendUsd:
          type: number
          description: Member-deduplicated spend attributed to this group for team and org rollups
        spendUpdatedAt:
          type: ["string", "null"]
          description: ISO timestamp when spend was last fetched
        budgetUsd:
          type: ["number", "null"]
          description: Effective budget in USD (from app-level group budget if set), null if not set
        budgetSource:
          type: ["string", "null"]
          description: Where the effective budget comes from ("app"), null if no budget set
        remainingUsd:
          type: ["number", "null"]
          description: budget - spend, null if no budget or spend not loaded
        percentUsed:
          type: ["number", "null"]
          description: spend / budget * 100, null if no budget or spend not loaded
        thresholdsFired:
          type: array
          description: Thresholds (50, 75, 90, 100) already alerted this billing period
          items:
            type: integer
    GroupsResponse:
      type: object
      required: [groups, isComplete, pendingCount, billingPeriodLabel]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        isComplete:
          type: boolean
          description: False while background usage fetches are still pending; poll every ~8s until true
        pendingCount:
          type: integer
          description: Number of outstanding raw group-spend and member-usage fetches
        billingPeriodLabel:
          type: string
          description: Human label of the selected range, e.g. "Jul 2026" or "Year to date"
    GroupMember:
      type: object
      required: [userId, spendLoaded]
      properties:
        userId:
          type: string
        username:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
          description: Full name if available
        role:
          type: ["string", "null"]
          description: Workspace role (admin, member, viewer, guest)
        isDisabled:
          type: ["boolean", "null"]
          description: Whether the member's workspace access is disabled
        allocatedBudgetUsd:
          type: ["number", "null"]
          description: Not used; always null (budgets are tracked at team level from the spreadsheet)
        budgetSource:
          type: ["string", "null"]
          description: Not used; always null
        spendLoaded:
          type: boolean
        spendUsd:
          type: ["number", "null"]
          description: Usage in the selected range attributable to this user within the group
        remainingUsd:
          type: ["number", "null"]
        percentUsed:
          type: ["number", "null"]
    GroupDetail:
      type: object
      required: [group, members, isComplete, rangeLabel, membersSpendUsd, unattributedSpendUsd]
      properties:
        group:
          $ref: "#/components/schemas/Group"
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
        membersSpendUsd:
          type: number
          description: Sum of loaded member spend (reconciles with group spend plus unattributed)
        unattributedSpendUsd:
          type: number
          description: Group spend not attributable to a listed member (deleted users, shared costs)
        isComplete:
          type: boolean
          description: False while member usage is still loading; poll every ~8s until true
        rangeLabel:
          type: string
    Summary:
      type: object
      required:
        [
          totalGroups,
          budgetedGroups,
          totalSpendUsd,
          totalBudgetUsd,
          groupsOver50,
          groupsOver75,
          groupsOver90,
          groupsOver100,
          alertsSentThisPeriod,
          billingPeriodLabel,
          isComplete,
        ]
      properties:
        totalGroups:
          type: integer
        budgetedGroups:
          type: integer
        totalSpendUsd:
          type: number
          description: Member-deduplicated spend across custom groups for the selected range
        totalBudgetUsd:
          type: number
          description: Sum of all effective group budgets (app or platform)
        totalRemainingUsd:
          type: number
          description: Sum of remaining budget across budgeted groups with loaded spend
        groupsOver50:
          type: integer
        groupsOver75:
          type: integer
        groupsOver90:
          type: integer
        groupsOver100:
          type: integer
        alertsSentThisPeriod:
          type: integer
        billingPeriodLabel:
          type: string
        isComplete:
          type: boolean
    GroupBudget:
      type: object
      required: [groupId, amountUsd, updatedAt]
      properties:
        groupId:
          type: string
        amountUsd:
          type: number
        updatedAt:
          type: string
    GroupBudgetInput:
      type: object
      required: [amountUsd]
      properties:
        amountUsd:
          type: number
          exclusiveMinimum: 0
    TeamBudget:
      type: object
      required: [teamName, amountUsd]
      properties:
        teamName:
          type: string
        amountUsd:
          type: ["number", "null"]
    TeamBudgetsResponse:
      type: object
      required: [budgets]
      properties:
        budgets:
          type: array
          items:
            $ref: "#/components/schemas/TeamBudget"
    TeamBudgetInput:
      type: object
      required: [amountUsd]
      properties:
        amountUsd:
          type: number
          minimum: 0
    AdminEmail:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        createdAt:
          type: string
    AdminEmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
    Alert:
      type: object
      required:
        [id, groupId, groupName, threshold, spendUsd, budgetUsd, recipients, sentAt, status]
      properties:
        id:
          type: integer
        groupId:
          type: string
        groupName:
          type: string
        threshold:
          type: integer
          description: Threshold percent crossed (50, 75, 90, 100)
        spendUsd:
          type: number
        budgetUsd:
          type: number
        recipients:
          type: array
          items:
            type: string
        sentAt:
          type: string
        status:
          type: string
          description: sent or failed
        errorMessage:
          type: ["string", "null"]
    CheckResult:
      type: object
      required: [checkedGroups, alertsSent]
      properties:
        checkedGroups:
          type: integer
        alertsSent:
          type: integer
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
    SystemStatus:
      type: object
      required:
        [enterpriseApiConfigured, enterpriseApiOk, emailConfigured, checkerIntervalMinutes]
      properties:
        enterpriseApiConfigured:
          type: boolean
          description: Whether REPLIT_ENTERPRISE_API_KEY is set
        enterpriseApiOk:
          type: boolean
          description: Whether the last Enterprise API call succeeded
        enterpriseApiError:
          type: ["string", "null"]
          description: Last Enterprise API error message, if any
        emailConfigured:
          type: boolean
          description: Whether the email connector is set up
        checkerIntervalMinutes:
          type: integer
        lastCheckAt:
          type: ["string", "null"]
