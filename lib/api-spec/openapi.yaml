      description: Reads persisted directory, billing-cycle usage, and limit observations without refreshing upstream data.
      parameters:
        - $ref: "#/components/parameters/WorkspaceIdPath"
      responses:
        "200":
          description: Set Limits workspace model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetLimitsWorkspace"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Workspace not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /limits/operations/prepare:
    post:
      operationId: prepareLimitOperation
      tags: [limits]
      summary: Freeze and review workspace member-limit targets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitOperationPrepareInput" }
      responses:
        "200":
          description: Frozen operation review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitOperation" }
        "400":
          description: Invalid amount or target selection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Idempotency key was reused for a different request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /limits/operations/{operationId}/commit:
    post:
      operationId: commitLimitOperation
      tags: [limits]
      summary: Commit an exactly reviewed limit operation
      parameters:
        - $ref: "#/components/parameters/LimitOperationIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LimitOperationCommitInput" }
      responses:
        "202":
          description: Durable operation accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitOperation" }
        "400":
          description: Commit does not match the frozen review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Operation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: A selected member already has an active operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /limits/operations/{operationId}:
    get:
      operationId: getLimitOperation
      tags: [limits]
      summary: Get and resume a durable limit operation
      parameters:
        - $ref: "#/components/parameters/LimitOperationIdPath"
      responses:
        "200":
          description: Current operation and per-target status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LimitOperation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Operation not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /limits/operations/{operationId}/retry:
    post:
